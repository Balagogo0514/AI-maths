      </div>
    </div>

      <h3>A. 單位圓雙角版</h3>
      <p>同一個單位圓上同時標出角 <code>x</code> 與 <code>2x</code>，直接把倍角看成角度翻倍。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
