<text x="196.4" y="105.5" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">Δr·Δθ</text>
<text x="50.0" y="170.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">0</text>
<text x="117.3" y="170.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">1</text>
<text x="184.7" y="170.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">2</text>
<text x="252.0" y="170.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">3</text>
<text x="151.0" y="181.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">r</text>
<text x="42.0" y="70.0" text-anchor="end" font-size="7.5" font-weight="400" fill="#898781">θ</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="191.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">f(r, θ) = (r cos θ, r sin θ)</text>
<text x="141.0" y="205.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">輸入 (r, θ) 的小矩形，被 f 送到 (x, y) 平面的彎曲小格</text>
<text x="141.0" y="219.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">雅可比矩陣 J 把小格「拉直」成平行四邊形（局部線性）</text>
<text x="141.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">J = [[cos θ, −r sin θ], [sin θ, r cos θ]]（按列）</text>
<text x="141.0" y="247.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">J 的兩欄 = ∂f/∂r 與 ∂f/∂θ，是兩條邊的方向</text>
<text x="141.0" y="261.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">中央差分驗證：200 個隨機點最大誤差 5.0×10⁻¹⁰</text>
<text x="141.0" y="274.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">(r, θ) = (2, 0.7) 時 det J = 2.000（已驗證）</text>
