<text x="415.0" y="191.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">小格面積 ≈ |det J|·Δr·Δθ = r·Δr·Δθ</text>
<text x="415.0" y="205.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">det J = r：離原點越遠，同樣的 (Δr, Δθ) 掃過的面積越大</text>
<text x="415.0" y="219.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">這就是極座標積分多乘的那個 r（§6）</text>
<text x="415.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">J 的第 1 欄 (藍) 是 r 方向，第 2 欄 (紫) 是 θ 方向</text>
<text x="415.0" y="247.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">兩欄長度 1 與 r，互相垂直 ⇒ 平行四邊形是矩形</text>
<text x="415.0" y="261.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">（箭頭按比例縮短：藍 0.55 倍、紫 0.3 倍，以免超出畫面）</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">局部線性近似的誤差 ∝ |Δx|²</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">f(x, y) = (x²y, 5x + sin y)，在 (1, 2) 處用 J 近似</text>
<line x1="596.0" y1="150.0" x2="790.0" y2="150.0" stroke="#898781" stroke-width="0.8"/>
<line x1="596.0" y1="150.0" x2="596.0" y2="58.0" stroke="#898781" stroke-width="0.8"/>
