<text x="590.0" y="147.7" text-anchor="end" font-size="7" font-weight="400" fill="#898781">10^-6</text>
<line x1="593.0" y1="109.5" x2="790.0" y2="109.5" stroke="#eee" stroke-width="0.6"/>
<text x="590.0" y="112.5" text-anchor="end" font-size="7" font-weight="400" fill="#898781">10^-4</text>
<line x1="593.0" y1="74.3" x2="790.0" y2="74.3" stroke="#eee" stroke-width="0.6"/>
<text x="590.0" y="77.3" text-anchor="end" font-size="7" font-weight="400" fill="#898781">10^-2</text>
<line x1="617.0" y1="144.5" x2="756.7" y2="74.1" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4,3"/>
<polyline points="756.7,70.1 686.9,105.4 617.0,140.6" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
<circle cx="756.7" cy="70.1" r="3" fill="#2a78d6"/>
<circle cx="686.9" cy="105.4" r="3" fill="#2a78d6"/>
<circle cx="617.0" cy="140.6" r="3" fill="#2a78d6"/>
<text x="617.0" y="160.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">10^-3</text>
<text x="686.9" y="160.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">10^-2</text>
<text x="756.7" y="160.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">10^-1</text>
<text x="693.0" y="170.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">|Δx|</text>
<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="191.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">線性近似：f(x₀ + Δx) ≈ f(x₀) + J·Δx</text>
<text x="684.0" y="205.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">|Δx| = 0.1：誤差 1.733e-02，誤差/|Δx|² = 1.733</text>
<text x="684.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">|Δx| = 0.01：誤差 1.708e-04，誤差/|Δx|² = 1.708</text>
<text x="684.0" y="229.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">|Δx| = 0.001：誤差 1.705e-06，誤差/|Δx|² = 1.705</text>
<text x="684.0" y="245.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#1baf7a">|Δx| 縮小 10 倍，誤差縮小 100 倍（已驗證）</text>
<text x="684.0" y="259.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">橘虛線：斜率 2。J 在 (1, 2) = [[4, 1], [5, −0.416]]</text>
<text x="684.0" y="272.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">局部線性 ≠ 全域線性：只在 x₀ 附近成立</text>
</svg>