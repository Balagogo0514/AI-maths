<text x="391.5" y="156.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">100</text>
<text x="437.7" y="156.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">200</text>
<text x="483.8" y="156.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">300</text>
<text x="530.0" y="156.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">400</text>
<text x="440.0" y="166.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">k（s = ⌊k·ln2/ln3⌋）</text>
<text x="526.0" y="124.0" text-anchor="end" font-size="7.5" font-weight="700" fill="#eb6834">橘：k·H(s/k) − log₂C(k,s)（精確）</text>
<text x="526.0" y="135.0" text-anchor="end" font-size="7.5" font-weight="700" fill="#2a78d6">藍虛線：½·log₂(2π·k·p·q)（Stirling 修正項）</text>
<rect x="322" y="178" width="210" height="106" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="427.0" y="192.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">log₂C(k,s) ≈ k·H(s/k) − ½·log₂(2πk·pq)</text>
<text x="427.0" y="205.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">兩曲線的差：k=10 為 0.038 bit，k=100 為 0.004 bit</text>
<text x="427.0" y="220.0" text-anchor="middle" font-size="9" font-weight="700" fill="#7c56c8">H(α) = 0.9500 bits，α = ln2/ln3</text>
<text x="427.0" y="233.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#0b0b0b">s ≈ 0.631k 的奇偶向量約 2^(0.95k) 個</text>
<text x="427.0" y="248.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">S(n,2) = 2^(n−1) − 1（Mersenne，§3.3）</text>
<text x="427.0" y="260.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">S(n,3) = (3^(n−1) − 2^n + 1)/2：指數幾乎相等，</text>
<text x="427.0" y="272.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">不像 2^k − 3^s（s≈0.63k）近乎抵消（n≤40 已驗證）</text>
