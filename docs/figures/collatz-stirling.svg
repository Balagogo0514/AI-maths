<text x="156.0" y="220.0" text-anchor="middle" font-size="9" font-weight="700" fill="#0b0b0b">E_(d+1) = E_d + O_d，O_(d+1) ≈ E_d / 3</text>
<text x="156.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">（偶數節點在 n ≡ 4 (mod 6) 時多一個奇數子節點）</text>
<text x="156.0" y="248.0" text-anchor="middle" font-size="9" font-weight="700" fill="#1baf7a">⇒ λ² = λ + 1/3，λ = (1+√(7/3))/2 ≈ 1.2638</text>
<text x="156.0" y="262.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#eb6834">實測 d=50→58 每步 ×1.2637；2^(1/3) = 1.2599 不符</text>
<text x="156.0" y="275.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">權重 1 → 黃金比 φ；權重 1/3 → 1.2638</text>
