<text x="684.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">1/|1−λ| = 2^k/|2^k − 3^s|：2、2、4、8、14.73</text>
<text x="684.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">T 在 ℝ 上斜率 1/2 與 3/2，不是一致擴張，</text>
<text x="684.0" y="229.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Ruelle 型跡公式不適用（記憶／推論）</text>
<text x="684.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">兩個分支都固定 ∞：群落在上三角（仿射）群，</text>
<text x="684.0" y="256.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">是可解群，不是 PSL(2,ℝ) 的格點 ⇒ 沒有雙曲曲面</text>
<text x="684.0" y="270.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">（推論）Selberg zeta 的 RH 類比無對應</text>
