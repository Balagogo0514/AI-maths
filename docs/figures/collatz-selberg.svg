<text x="415.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">這裡 e^x ↔ 2^k：拓撲熵 ln 2 取代曲率</text>
<text x="415.0" y="271.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ℤ 上只有 5 個原始循環（k ≤ 18，§3.13）</text>
