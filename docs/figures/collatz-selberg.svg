<text x="141.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">tr(A^k) = 2^k，k = 1…12 全部成立（已驗證）</text>
<text x="141.0" y="216.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">特徵多項式只剩 x^N − 2x^(N−1)：譜 = {2, 0, …, 0}</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">譜側（本徵值 2）= 週期軌道側（Lyndon 字）</text>
<text x="141.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">與 ζ_T = 1/(1 − 2z) 一致（§3.13、§3.18）</text>
<text x="141.0" y="257.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">Selberg 跡公式的離散類比：Bowen–Lanford／Ruelle（記憶）</text>
<text x="141.0" y="271.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Selberg 本身需要雙曲曲面與 Laplacian</text>
