<text x="290" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">IL(r) = 2√r/(1+r) − 1：r=4（漲4倍）或r=0.25（跌至¼）時 IL ≈ −20%（對稱）</text>
