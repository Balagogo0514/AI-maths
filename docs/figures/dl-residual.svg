<text x="334" y="198" font-family="sans-serif" font-size="8" fill="#898781">恆等</text>
<text x="334" y="208" font-family="sans-serif" font-size="8" fill="#898781">映射</text>
<text x="252" y="186" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2a78d6">F(x)</text>
<line x1="302" y1="250" x2="302" y2="114" stroke="#eda100" stroke-width="2.5" opacity="0.9" stroke-dasharray="3,2"/>
<polygon points="302,114 298,122 306,122" fill="#eda100" opacity="0.9"/>
<text x="306" y="186" font-family="sans-serif" font-size="8" fill="#eda100" opacity="0.9">∂L/∂w</text>
<text x="306" y="196" font-family="sans-serif" font-size="8" fill="#eda100" opacity="0.9">≥ 1</text>
<rect x="390" y="52" width="178" height="216" rx="6" fill="#e1e0d9" opacity="0.4" stroke="#c3c2b7" stroke-width="1"/>
<text x="479" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">數學分析</text>
<text x="400" y="134" font-family="sans-serif" font-size="9" fill="#2a78d6">普通層：H(x) = F(x)</text>
<text x="400" y="152" font-family="sans-serif" font-size="9" fill="#1baf7a">殘差層：H(x) = F(x) + x</text>
<text x="400" y="172" font-family="sans-serif" font-size="9" fill="#0b0b0b">梯度（普通）：</text>
<text x="400" y="185" font-family="sans-serif" font-size="9" fill="#eb6834">∂L/∂x = ∂L/∂H · ∂F/∂x</text>
<text x="400" y="198" font-family="sans-serif" font-size="9" fill="#eb6834">          → 0  (深層消失)</text>
<text x="400" y="218" font-family="sans-serif" font-size="9" fill="#0b0b0b">梯度（殘差）：</text>
<text x="400" y="231" font-family="sans-serif" font-size="9" fill="#2a78d6">∂L/∂x = ∂L/∂H · (1 + ∂F/∂x)</text>
<text x="400" y="246" font-family="sans-serif" font-size="9" fill="#1baf7a">        ≥ ∂L/∂H  (永不消失)</text>
<text x="400" y="266" font-family="sans-serif" font-size="9" fill="#898781">即使 ∂F/∂x ≈ 0，</text>
<text x="400" y="278" font-family="sans-serif" font-size="9" fill="#898781">+1 項保証梯度回傳</text>
<text x="400" y="300" font-family="sans-serif" font-size="9" fill="#eda100">★ ResNet 2015 Top-1: 3.57%</text>
<text x="400" y="312" font-family="sans-serif" font-size="9" fill="#eda100">   首次超越人眼（5.1%）</text>
</svg>