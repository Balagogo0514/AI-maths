<text x="280" y="70" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#898781">梯度直通跳躍路徑</text>
<ellipse cx="280" cy="100" rx="34" ry="10" fill="#e1e0d9" stroke="#c3c2b7" stroke-width="1"/>
<text x="280" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#898781">x</text>
<rect x="246" y="136" width="68" height="24" rx="4" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
<text x="280" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2a78d6">Weight Layer 1</text>
<rect x="246" y="200" width="68" height="24" rx="4" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
<text x="280" y="216" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2a78d6">Weight Layer 2</text>
<circle cx="280" cy="260" r="14" fill="#1baf7a" opacity="0.15" stroke="#1baf7a" stroke-width="2"/>
<text x="280" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1baf7a">⊕</text>
<ellipse cx="280" cy="308" rx="34" ry="10" fill="#e1e0d9" stroke="#c3c2b7" stroke-width="1"/>
