<text x="87.4" y="170.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">m（模 3^m）</text>
<text x="196.8" y="170.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">k（模 2^k）</text>
<text x="49.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">藍：2 是模 3^m 的原根　橘：3 只走單位群的一半</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">ord_(3^m)(2) = 2·3^(m−1)（m = 1…10）</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">ord_(2^k)(3) = 2^(k−2)（k = 3…20）</text>
<text x="141.0" y="216.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">(ℤ/2^k)^× 的最大元素階 = 2^(k−2) &lt; φ（k = 3…10）：不循環</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">模 3^m：乘以 2^(−v) 走遍全部單位 ⇒ 混合快（§3.23）</text>
<text x="141.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">模 2^k：3 只生成一半 ⇒ 3-進收縮對偶（§3.2）</text>
<text x="141.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Disquisitiones：原根與單位群結構（記憶）</text>
<text x="141.0" y="272.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">詮釋是推論，不是已知定理</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">二次 Gauss 和 |G(p)| = √p 與一個巧合</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">G(p) = Σ_n (n/p) e^(2πin/p)，p 為奇質數 ≤ 101</text>
