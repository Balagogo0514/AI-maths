<text x="325.0" y="56.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">藍：|G(p)|（實算）　橘虛線：√p</text>
<rect x="290" y="176" width="250" height="108" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="190.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">p ≤ 101 的 25 個奇質數：|G(p)| = √p（已驗證，教科書結果）</text>
<text x="415.0" y="205.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">巧合：§3.23 穩態在模 3 上 P(1) = 1/3，P(2) = 2/3</text>
<text x="415.0" y="218.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">|π̂(1)| = |ω/3 + 2ω²/3| = 0.57735 = 1/√3</text>
<text x="415.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">歸一化二次 Gauss 和 |G(3)|/3 = 0.57735，也是 1/√3</text>
<text x="415.0" y="245.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">兩者相等只因 a² + b² − ab 的數字剛好一致，無結構意義</text>
<text x="415.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">p ≥ 5：Syracuse 像在 ℤ/p 上均勻（§3.18），無此偏斜</text>
<text x="415.0" y="271.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">Gauss 和是 L 函數函數方程的根數（記憶）；Collatz 無函數方程</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">三角形數當 Collatz 起點：無特殊性</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">n = m(m+1)/2，m = 150…1499（1350 個），steps/(a ln n)</text>
