<text x="49.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">橘：與「18 個單位上均勻」的 TV　藍：與穩態的 TV</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">100,000 個 n ∈ [10⁹, 2×10⁹]：K = 3 就與穩態一致（TV ≈ 0.005）</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">穩態模 3：P(1) = 1/3，P(2) = 2/3（v 奇數的機率 2/3）</text>
<text x="141.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">與均勻的 TV 穩定在約 0.345（K ≥ 3），不是均勻（已驗證）</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">|π̂(9)| = |π̂(18)| = 0.577，均勻分布在單位上是 0.5</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">Tao：估計 ℤ/3ⁿ 上偏斜隨機游走特徵函數的高頻（搜尋摘要）</text>
<text x="141.0" y="259.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">這是「偏斜」的意思：高頻特徵函數不為零</text>
<text x="141.0" y="272.0" text-anchor="middle" font-size="8" font-weight="700" fill="#d94040">Tao 的方法只給「幾乎所有」，不是猜想本身</text>
