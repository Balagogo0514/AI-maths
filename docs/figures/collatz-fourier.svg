<text x="415.0" y="190.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">奇數 n 的平均步數 125.55，偶數 113.15，差 12.40</text>
<text x="415.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">對應頻率 ½ 的振幅 6.2（差的一半）</text>
<text x="415.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">dyadic 頻率 j/2^m 的譜線都高出背景一個數量級以上</text>
<text x="415.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">原因：平均步數依賴 n mod 2^k（§3.1）</text>
<text x="415.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">= ℤ/2^k 上的一般 Fourier 結構</text>
<text x="415.0" y="258.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">整個延拓 f(x) = x + ¼ − (2x+1)cos(πx)/4 的頻譜</text>
<text x="415.0" y="270.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">只在 0、±½（含導數項），已與 T 在整數上核對</text>
