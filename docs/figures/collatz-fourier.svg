<text x="684.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">ξ = 0.1234，n &lt; 1200：直接計算與右式最大誤差 2.6e-13</text>
<text x="684.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">= §3.20 的 Hecke 型多值對應在頻率空間的樣子</text>
<text x="684.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">收縮 3 倍對應 3-進（Tao 用模 3ⁿ 的特徵）</text>
<text x="684.0" y="245.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ln n 上的 Fourier 變換就是 Mellin 變換（§3.22）</text>
<text x="684.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">§3.13 的週期圖：零點頻率與 ln 2 等週期無振盪</text>
<text x="684.0" y="272.0" text-anchor="middle" font-size="8" font-weight="700" fill="#d94040">Fourier 是 Tao 部分結果的工具，不是證明</text>
