<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">總參數 vs 每個 token 啟用的參數</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">Mixtral 類設定：8 選 2 專家、32 層（算術）</text>
<text x="24.0" y="62.0" text-anchor="start" font-size="7.3" font-weight="700" fill="#0b0b0b">bf16 權重（GB）</text>
<rect x="24.0" y="68" width="180.7" height="18" fill="#eb6834" opacity="0.85"/>
<text x="28.0" y="81.0" text-anchor="start" font-size="7.2" font-weight="700" fill="white">總參數 46.7B：93.4 GB（要常駐）</text>
<rect x="24.0" y="92" width="49.8" height="18" fill="#1baf7a" opacity="0.85"/>
<text x="77.8" y="105.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#1baf7a">啟用 12.9B：25.8 GB</text>
<line x1="178.8" y1="64.0" x2="178.8" y2="114.0" stroke="#d94040" stroke-width="1" stroke-dasharray="3,2"/>
<text x="178.8" y="124.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#d94040">單張 GPU 80 GB</text>
<rect x="18" y="134" width="246" height="62" rx="4" fill="#2a78d6" opacity="0.07" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="149.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">每個 token 的計算量約為同總參數稠密模型的 28%</text>
<text x="141.0" y="163.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#0b0b0b">專家占總參數的 96.6%</text>
<text x="141.0" y="177.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">每個 token 只算 2 個專家，但下一個 token</text>
<text x="141.0" y="189.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">可能選到任何一個，所以全部都得放著</text>
<rect x="18" y="206" width="246" height="78" rx="4" fill="#eb6834" opacity="0.06" stroke="#eb6834" stroke-width="0.9"/>
<text x="141.0" y="221.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">MoE：用更多記憶體換更少計算</text>
<text x="141.0" y="235.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">KV cache 與 MoE 無關：每 token 131,072 B（已驗證）</text>
<text x="141.0" y="249.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">（MoE 只改前饋層，不改 attention）</text>
<text x="141.0" y="264.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">DeepSeek-V3 約 671B 總／37B 啟用（記憶）</text>
<text x="141.0" y="276.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">批次越大，每步讀到的專家越多</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">假設每層均勻隨機路由；數字 = 被碰到的專家數／8</text>
<text x="324.0" y="65.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 1</text>
<rect x="330.0" y="54" width="41.4" height="15" fill="#1baf7a" opacity="0.85"/>
<text x="375.4" y="65.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#1baf7a">25.8 GB（2.0/8）</text>
<text x="324.0" y="87.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 2</text>
<rect x="330.0" y="76" width="68.5" height="15" fill="#1baf7a" opacity="0.85"/>
<text x="402.5" y="87.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#1baf7a">42.7 GB（3.5/8）</text>
<text x="324.0" y="109.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 4</text>
<rect x="330.0" y="98" width="104.2" height="15" fill="#eda100" opacity="0.85"/>
<text x="438.2" y="109.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#eda100">64.9 GB（5.5/8）</text>
<text x="324.0" y="131.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 8</text>
<rect x="330.0" y="120" width="135.5" height="15" fill="#eb6834" opacity="0.85"/>
<text x="469.5" y="131.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#eb6834">84.4 GB（7.2/8）</text>
<text x="324.0" y="153.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 16</text>
<rect x="330.0" y="142" width="148.6" height="15" fill="#eb6834" opacity="0.85"/>
<text x="482.6" y="153.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#eb6834">92.5 GB（7.9/8）</text>
<text x="324.0" y="175.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 32</text>
<rect x="330.0" y="164" width="150.0" height="15" fill="#eb6834" opacity="0.85"/>
<text x="484.0" y="175.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#eb6834">93.4 GB（8.0/8）</text>
<line x1="371.4" y1="50.0" x2="371.4" y2="188.0" stroke="#1baf7a" stroke-width="0.9" stroke-dasharray="3,2"/>
<text x="371.4" y="197.0" text-anchor="middle" font-size="6.4" font-weight="700" fill="#1baf7a">只讀啟用部分 25.8</text>
<rect x="290" y="206" width="250" height="78" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="415.0" y="221.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">小批次：讀得少、很快</text>
<text x="415.0" y="234.0" text-anchor="middle" font-size="7.1" font-weight="700" fill="#0b0b0b">批次 16～32 以上：幾乎讀到全部 93.4 GB</text>
<text x="415.0" y="247.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">計算量仍只有 28%，頻寬優勢卻消失</text>
<text x="415.0" y="262.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#d94040">真實路由有偏斜，被碰到的專家會比表中少（記憶）</text>
<text x="415.0" y="275.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">多 GPU：專家並行與 all-to-all</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">8 張 GPU，每張放 1 個專家（每層）</text>
<rect x="570.0" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="583.0" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU1</text>
<text x="583.0" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家1</text>
<rect x="598.5" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.22" stroke="#2a78d6" stroke-width="0.8"/>
<text x="611.5" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU2</text>
<text x="611.5" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家2</text>
<rect x="627.0" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="640.0" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU3</text>
<text x="640.0" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家3</text>
<rect x="655.5" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.22" stroke="#2a78d6" stroke-width="0.8"/>
<text x="668.5" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU4</text>
<text x="668.5" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家4</text>
<rect x="684.0" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="697.0" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU5</text>
<text x="697.0" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家5</text>
<rect x="712.5" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.22" stroke="#2a78d6" stroke-width="0.8"/>
<text x="725.5" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU6</text>
<text x="725.5" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家6</text>
<rect x="741.0" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="754.0" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU7</text>
<text x="754.0" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家7</text>
<rect x="769.5" y="54" width="26" height="30" rx="3" fill="#2a78d6" opacity="0.22" stroke="#2a78d6" stroke-width="0.8"/>
<text x="782.5" y="66.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0b0b0b">GPU8</text>
<text x="782.5" y="78.0" text-anchor="middle" font-size="5.8" font-weight="400" fill="#898781">專家8</text>
<rect x="566" y="96" width="236" height="20" rx="4" fill="#1baf7a" opacity="0.15" stroke="#1baf7a" stroke-width="0.9"/>
<text x="684.0" y="109.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0b0b0b">router 決定每個 token 去哪（all-to-all：送出、算完、送回）</text>
<text x="684.0" y="132.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#0b0b0b">每張卡：專家 11.3 GB ＋ 非專家（若複製）3.2 GB（已驗證：算術）</text>
<rect x="566" y="142" width="236" height="142" rx="4" fill="#eb6834" opacity="0.06" stroke="#eb6834" stroke-width="0.9"/>
<text x="684.0" y="157.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">代價與風險（記憶）</text>
<text x="574.0" y="173.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• all-to-all 通訊在跨節點時很貴</text>
<text x="574.0" y="188.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• 路由不均 → 熱門專家的 GPU 被壓垮</text>
<text x="574.0" y="203.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• 常加負載平衡損失或容量上限</text>
<text x="574.0" y="218.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• 訓練狀態仍與總參數成正比</text>
<text x="574.0" y="233.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• 量化或卸載冷門專家是常見省法</text>
<text x="574.0" y="248.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#0b0b0b">• 卸載後若被選中：頻寬差 1～3 個數量級</text>
<text x="684.0" y="278.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
</svg>