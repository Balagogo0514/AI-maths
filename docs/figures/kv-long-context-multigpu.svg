<text x="742.0" y="125.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#1baf7a">切 token（context）</text>
<text x="684.0" y="140.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">同色 = 放在同一張卡（示意：每種切成 2 份）</text>
<rect x="566" y="152" width="236" height="132" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="166.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0b0b0b">Tensor：每層都要通訊，受 KV head 數限制（8 個就最多切 8 份）</text>
<text x="684.0" y="179.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#0b0b0b">Pipeline：放得下，但 decode 延遲不降（記憶）</text>
<text x="684.0" y="192.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#1baf7a">Context：長上下文的 cache 與 n² 計算都可分攤</text>
<text x="684.0" y="206.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">實際系統常混用：節點內 tensor，節點間 pipeline 或 context</text>
<text x="684.0" y="219.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">另可把 prefill 與 decode 分到不同 GPU 群（記憶）</text>
<text x="684.0" y="232.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">再配合：GQA、FP8、滑動視窗、前綴共享、分頁、換出</text>
<text x="684.0" y="246.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">（§7.1、§7.2、§7.3、§12.5、§12.7）</text>
<text x="684.0" y="260.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#d94040">各系統的實作與通訊細節依印象整理，沒有查證</text>
<text x="684.0" y="273.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
