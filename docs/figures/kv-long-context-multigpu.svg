<text x="419.0" y="116.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#0b0b0b">各段的 (最大值, softmax 分母, 加權和) → 合併</text>
<text x="419.0" y="134.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">Ring Attention：K/V 區塊沿環狀傳遞，邊傳邊算（記憶）</text>
<rect x="290" y="176" width="250" height="108" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="190.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">分片後再合併是精確的（已驗證）：4096 個 token、8 段</text>
<text x="415.0" y="204.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">一次合併 vs 完整 attention：最大差 8.3e-17</text>
<text x="415.0" y="218.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">逐段累加（環狀）vs 完整：最大差 7.3e-17</text>
<text x="415.0" y="232.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">所以切分不改變數學，只是把一個大 softmax 拆成可平行的小塊</text>
<text x="415.0" y="246.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">prefill：n² 的計算分攤；decode：每張卡只讀 1/8 的 cache</text>
<text x="415.0" y="260.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#d94040">代價：通訊要和計算重疊（記憶）</text>
<text x="415.0" y="273.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">三種切法：切層、切 head、切 token</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">把「層 × token」的 KV cache 想成一張網格</text>
<text x="578.0" y="60.0" text-anchor="start" font-size="6.3" font-weight="400" fill="#898781">層↓　token→</text>
