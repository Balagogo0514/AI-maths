<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">一百萬 token：三個瓶頸</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">假設 70B 等級 GQA 模型（算術，不是實測）</text>
<text x="18.0" y="62.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">容量：KV cache（GB）</text>
<rect x="24" y="68" width="217.8" height="11" fill="#2a78d6" opacity="0.8"/>
<text x="237.8" y="77.0" text-anchor="end" font-size="7.2" font-weight="700" fill="white">bf16：328 GB</text>
<rect x="24" y="84" width="108.9" height="11" fill="#1baf7a" opacity="0.8"/>
<text x="136.9" y="93.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#1baf7a">FP8：164 GB</text>
<line x1="77.2" y1="64.0" x2="77.2" y2="102.0" stroke="#d94040" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="130.4" y1="64.0" x2="130.4" y2="102.0" stroke="#d94040" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="183.5" y1="64.0" x2="183.5" y2="102.0" stroke="#d94040" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="236.7" y1="64.0" x2="236.7" y2="102.0" stroke="#d94040" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="50.6" y="112.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#d94040">80 GB</text>
<text x="210.1" y="112.0" text-anchor="end" font-size="6.8" font-weight="700" fill="#d94040">5 張 80 GB 才放得下（bf16）</text>
<text x="18.0" y="130.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">prefill 時間（分鐘，利用率 40%）</text>
<rect x="24" y="136" width="190.2" height="10" fill="#eb6834" opacity="0.8"/>
<text x="210.2" y="144.5" text-anchor="end" font-size="7" font-weight="700" fill="white">1 張 GPU：61.1</text>
<rect x="24" y="150" width="23.8" height="10" fill="#1baf7a" opacity="0.8"/>
<text x="51.8" y="158.5" text-anchor="start" font-size="7" font-weight="700" fill="#1baf7a">8 張（理想）：7.6</text>
<text x="18.0" y="176.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">decode 每個 token 讀完整份 cache</text>
<rect x="18" y="182" width="246" height="14" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="24.0" y="192.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">1 張：0.10 秒　　8 張（分片）：12 ms</text>
<rect x="18" y="204" width="246" height="80" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="218.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">attention 的計算量約為線性層的 9.4 倍（與 n² 成正比）</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">attention 1.3e+18 FLOPs，線性層 1.4e+17 FLOPs</text>
<text x="141.0" y="244.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">峰值 990 TFLOPs、頻寬 3.35 TB/s 是假設的 GPU 規格</text>
<text x="141.0" y="257.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#d94040">沒計入權重、通訊與實際利用率的損失</text>
<text x="141.0" y="270.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#d94040">容量、prefill 計算、decode 頻寬三個都卡</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">序列（context）parallel：切 token</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">每張 GPU 只存、只算自己那段 K/V；再精確合併</text>
