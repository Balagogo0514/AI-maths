  <text x="700" y="374" text-anchor="middle" font-size="9" fill="#898781">+梯度分片</text>
  <rect x="750" y="289.6" width="60" height="38.4" fill="#2a78d6" opacity="0.85" rx="4"/>
  <text x="780" y="283.6" text-anchor="middle" font-size="11" font-weight="600" fill="#2a78d6">16%</text>
  <text x="780" y="348" text-anchor="middle" font-size="10" fill="#0b0b0b">ZeRO-3</text>
  <text x="780" y="374" text-anchor="middle" font-size="9" fill="#898781">+參數分片</text>
