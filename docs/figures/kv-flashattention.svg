<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Prefill：n×n 分數矩陣放不下</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">每頭每層、bf16 的完整分數矩陣（算術）</text>
<rect x="24" y="52" width="5.6" height="11" fill="#2a78d6" opacity="0.8"/>
<text x="33.6" y="61.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">n = 32,768：2.1 GB</text>
<rect x="24" y="69" width="89.3" height="11" fill="#eb6834" opacity="0.8"/>
<text x="117.3" y="78.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#eb6834">n = 131,072：34.4 GB</text>
<rect x="24" y="86" width="214.0" height="11" fill="#d94040" opacity="0.8"/>
<text x="28.0" y="95.0" text-anchor="start" font-size="7.2" font-weight="700" fill="white">n = 1,000,000：2,000 GB（超出刻度）</text>
<line x1="232.0" y1="48.0" x2="232.0" y2="105.0" stroke="#d94040" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="232.0" y="116.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#d94040">80 GB 顯存</text>
<text x="18.0" y="134.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">FlashAttention：分塊在 SRAM 內算，不寫回完整矩陣</text>
<rect x="28" y="142" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="43" y="142" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="58" y="142" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="73" y="142" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="28" y="157" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="43" y="157" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="58" y="157" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="73" y="157" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="28" y="172" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="43" y="172" width="13.5" height="13.5" fill="#1baf7a" opacity="0.85"/>
<rect x="58" y="172" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="73" y="172" width="13.5" height="13.5" fill="none" stroke="#898781" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="28" y="187" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="43" y="187" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="58" y="187" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<rect x="73" y="187" width="13.5" height="13.5" fill="#2a78d6" opacity="0.22"/>
<text x="58.0" y="212.0" text-anchor="middle" font-size="6.5" font-weight="400" fill="#898781">Q 塊（列）× K 塊（欄）</text>
<text x="100.0" y="150.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">逐塊更新每列的</text>
<text x="100.0" y="162.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">(最大值 m、分母 ℓ、輸出 o)</text>
<text x="100.0" y="176.0" text-anchor="start" font-size="6.8" font-weight="400" fill="#898781">舊的結果乘上修正係數後累加</text>
<text x="100.0" y="189.0" text-anchor="start" font-size="6.8" font-weight="400" fill="#898781">用完的分數塊直接丟掉</text>
<rect x="18" y="214" width="246" height="70" rx="4" fill="#1baf7a" opacity="0.07" stroke="#1baf7a" stroke-width="0.9"/>
<text x="141.0" y="229.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">分塊結果 vs 標準 causal attention：最大差 5.6e-16</text>
<text x="141.0" y="243.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">（已驗證：n=512、d=64、塊 64）→ 精確，不是近似</text>
<text x="141.0" y="257.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">附加顯存從 O(n²) 降到 O(n)</text>
<text x="141.0" y="271.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">長 prompt 的 prefill 才做得到</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Decode：瓶頸是讀 KV，不是 n²</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">query 長度 = 1，每步只多一列分數（T = 1,000,000）</text>
<text x="290.0" y="60.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">每頭每層的資料量（假設 d_head=128、bf16）</text>
<rect x="292" y="66" width="2.4" height="12" fill="#1baf7a" opacity="0.85"/>
<text x="300.9" y="76.0" text-anchor="start" font-size="7.3" font-weight="700" fill="#1baf7a">分數一列：2.0 MB</text>
<rect x="292" y="84" width="232" height="12" fill="#eb6834" opacity="0.85"/>
<text x="519.0" y="94.0" text-anchor="end" font-size="7.3" font-weight="700" fill="white">要讀的 K/V：512 MB（256 倍）</text>
<text x="415.0" y="112.0" text-anchor="middle" font-size="7" font-weight="700" fill="#0b0b0b">每個 token 都要把整份 KV cache 從 HBM 讀一遍 → 受頻寬限制</text>
<text x="290.0" y="130.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">Flash-decoding：把 KV 沿序列切開，各自算再精確合併</text>
<rect x="292" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="305.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV1</text>
<line x1="305.5" y1="158.0" x2="305.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="321" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.22999999999999998" stroke="#2a78d6" stroke-width="0.8"/>
<text x="334.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV2</text>
<line x1="334.5" y1="158.0" x2="334.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="350" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="363.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV3</text>
<line x1="363.5" y1="158.0" x2="363.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="379" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.22999999999999998" stroke="#2a78d6" stroke-width="0.8"/>
<text x="392.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV4</text>
<line x1="392.5" y1="158.0" x2="392.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="408" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="421.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV5</text>
<line x1="421.5" y1="158.0" x2="421.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="437" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.22999999999999998" stroke="#2a78d6" stroke-width="0.8"/>
<text x="450.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV6</text>
<line x1="450.5" y1="158.0" x2="450.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="466" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="0.8"/>
<text x="479.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV7</text>
<line x1="479.5" y1="158.0" x2="479.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="495" y="138" width="27" height="20" rx="3" fill="#2a78d6" opacity="0.22999999999999998" stroke="#2a78d6" stroke-width="0.8"/>
<text x="508.5" y="151.0" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0b0b0b">KV8</text>
<line x1="508.5" y1="158.0" x2="508.5" y2="168.0" stroke="#1baf7a" stroke-width="1"/>
<rect x="292" y="168" width="230" height="14" rx="3" fill="#1baf7a" opacity="0.25" stroke="#1baf7a" stroke-width="1"/>
<text x="407.0" y="178.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#0b0b0b">合併 (m, ℓ, o)：與 online softmax 同一組公式</text>
<rect x="290" y="194" width="250" height="90" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="208.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#1baf7a">8 段合併 vs 完整 attention：最大差 1.3e-16（已驗證）</text>
<text x="415.0" y="222.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">這就是 §12.9 跨 GPU 分片合併用的同一個數學</text>
<text x="415.0" y="236.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">FlashAttention 對 decode 的幫助較小：</text>
<text x="415.0" y="249.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">沒有 n² 矩陣可省，要靠切分 KV 提高平行度</text>
<text x="415.0" y="263.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#d94040">kernel 名稱與細節依印象整理，沒有查證</text>
<text x="415.0" y="276.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">分工：存什麼 vs 怎麼算</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">兩個旋鈕互相獨立</text>
<text x="654.0" y="58.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">標準 attention</text>
<text x="758.0" y="58.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">FlashAttention</text>
<rect x="604" y="66" width="100" height="52" rx="4" fill="#d94040" opacity="0.08" stroke="#d94040" stroke-width="0.9"/>
<text x="654.0" y="88.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">每步重算全部</text>
<text x="654.0" y="100.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">K/V 與 n² 分數</text>
<rect x="708" y="66" width="100" height="52" rx="4" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="0.9"/>
<text x="758.0" y="88.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">顯存省了，</text>
<text x="758.0" y="100.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">但仍重算舊 token</text>
<rect x="604" y="122" width="100" height="52" rx="4" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="0.9"/>
<text x="654.0" y="144.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">不重算舊 token，</text>
<text x="654.0" y="156.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">但 prefill 要 n² 顯存</text>
<rect x="708" y="122" width="100" height="52" rx="4" fill="#1baf7a" opacity="0.16" stroke="#1baf7a" stroke-width="0.9"/>
<text x="758.0" y="144.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#0b0b0b">實務組合：</text>
<text x="758.0" y="156.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#0b0b0b">兩個都開</text>
<text x="598.0" y="95.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">無</text>
<text x="598.0" y="151.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">有</text>
<text x="598.0" y="84.0" text-anchor="end" font-size="6.6" font-weight="400" fill="#898781">KV</text>
<text x="598.0" y="140.0" text-anchor="end" font-size="6.6" font-weight="400" fill="#898781">KV</text>
<text x="572.0" y="120.0" text-anchor="start" font-size="6.4" font-weight="400" fill="#898781">cache</text>
<rect x="566" y="190" width="236" height="94" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="205.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#d94040">FlashAttention 不縮小 KV cache</text>
<text x="684.0" y="219.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#0b0b0b">cache 太大要靠 GQA、量化、分頁、前綴共享、</text>
<text x="684.0" y="232.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#0b0b0b">滑動視窗、多 GPU 切分（§5.1、§7、§12）</text>
<text x="684.0" y="247.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">KV cache：省重複的計算（FLOPs）</text>
<text x="684.0" y="259.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">FlashAttention：省 HBM 讀寫與中間矩陣顯存</text>
<text x="684.0" y="273.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#1baf7a">兩者都是精確的，不改變輸出</text>
</svg>