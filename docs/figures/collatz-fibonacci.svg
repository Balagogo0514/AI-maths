<text x="141.0" y="212.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">以 E 結尾：前面任意合法序列（a_(m−1)）</text>
<text x="141.0" y="223.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">以 O 結尾：前一個必為 E（a_(m−2)）</text>
<text x="141.0" y="238.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">區塊分解：OE ↔ 捷徑版位元 1，E ↔ 位元 0</text>
<text x="141.0" y="250.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">各 1/2，平均每個捷徑步 = 1.5 個標準步</text>
<text x="141.0" y="265.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#eb6834">拓撲熵 ln φ ≈ 0.481；Haar 熵 ln2/1.5 ≈ 0.462</text>
<text x="141.0" y="277.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">（Haar 測度不是最大熵測度，已計算）</text>
