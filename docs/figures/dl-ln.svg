<rect width="820" height="340" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="265" height="320" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="142" y="30" text-anchor="middle" font-weight="700" font-size="12" fill="#0b0b0b">LayerNorm vs RMSNorm 計算步驟</text>
<text x="22" y="45" font-size="10" font-weight="600" fill="#898781">x ∈ ℝᵈ</text>
<rect x="22" y="48" width="24" height="20" rx="2" fill="#ee8054"/>
<text x="34" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">2.1</text>
<rect x="48" y="48" width="24" height="20" rx="2" fill="#bad3f1"/>
<text x="60" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">-0.8</text>
<rect x="74" y="48" width="24" height="20" rx="2" fill="#f3a485"/>
<text x="86" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">1.5</text>
<rect x="100" y="48" width="24" height="20" rx="2" fill="#98beeb"/>
<text x="112" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">-1.2</text>
<rect x="126" y="48" width="24" height="20" rx="2" fill="#fcece6"/>
<text x="138" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">0.3</text>
<rect x="152" y="48" width="24" height="20" rx="2" fill="#f0926c"/>
<text x="164" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">1.8</text>
<rect x="178" y="48" width="24" height="20" rx="2" fill="#d4e4f6"/>
<text x="190" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">-0.5</text>
<rect x="204" y="48" width="24" height="20" rx="2" fill="#f7c8b5"/>
<text x="216" y="61" text-anchor="middle" font-size="8.5" fill="#0b0b0b">0.9</text>
<rect x="22" y="82" width="245" height="22" rx="4" fill="#eb6834" opacity="0.1" stroke="#eb6834" stroke-width="1.2"/>
<text x="28" y="96" font-size="10" font-weight="600" fill="#eb6834">① 均值 μ = mean(x)</text>
<text x="267" y="96" text-anchor="end" font-size="9" fill="#898781" font-style="italic">僅 LayerNorm</text>
<rect x="22" y="110" width="245" height="22" rx="4" fill="#eb6834" opacity="0.1" stroke="#eb6834" stroke-width="1.2"/>
<text x="28" y="124" font-size="10" font-weight="600" fill="#eb6834">② 方差 σ² = var(x−μ)</text>
<text x="267" y="124" text-anchor="end" font-size="9" fill="#898781" font-style="italic">僅 LayerNorm</text>
<rect x="22" y="138" width="245" height="22" rx="4" fill="#2a78d6" opacity="0.1" stroke="#2a78d6" stroke-width="1.2"/>
<text x="28" y="152" font-size="10" font-weight="600" fill="#2a78d6">③ 正規化  x̂ = (x−μ)/√(σ²+ε)</text>
<text x="267" y="152" text-anchor="end" font-size="9" fill="#898781" font-style="italic">LN：去均值+縮放</text>
<rect x="22" y="166" width="245" height="22" rx="4" fill="#1baf7a" opacity="0.1" stroke="#1baf7a" stroke-width="1.2"/>
<text x="28" y="180" font-size="10" font-weight="600" fill="#1baf7a">③' RMS = √mean(x²)</text>
<text x="267" y="180" text-anchor="end" font-size="9" fill="#898781" font-style="italic">RMSNorm：無需 μ</text>
<rect x="22" y="194" width="245" height="22" rx="4" fill="#1baf7a" opacity="0.1" stroke="#1baf7a" stroke-width="1.2"/>
<text x="28" y="208" font-size="10" font-weight="600" fill="#1baf7a">③' x̂ = x / RMS(x)</text>
<text x="267" y="208" text-anchor="end" font-size="9" fill="#898781" font-style="italic">RMSNorm：只縮放</text>
<rect x="22" y="222" width="245" height="22" rx="4" fill="#7c56c8" opacity="0.1" stroke="#7c56c8" stroke-width="1.2"/>
<text x="28" y="236" font-size="10" font-weight="600" fill="#7c56c8">④ 仿射  y = γ⊙x̂ + β</text>
<text x="267" y="236" text-anchor="end" font-size="9" fill="#898781" font-style="italic">γ,β 可學習（RMSNorm 無 β）</text>
<text x="22" y="252" font-size="10" font-weight="600" fill="#898781">y ∈ ℝᵈ（正規化後）</text>
<rect x="22" y="258" width="24" height="20" rx="2" fill="#ec7648"/>
<text x="34" y="271" text-anchor="middle" font-size="8.5" fill="#0b0b0b">1.4</text>
<rect x="48" y="258" width="24" height="20" rx="2" fill="#609ae0"/>
<text x="60" y="271" text-anchor="middle" font-size="8.5" fill="#0b0b0b">-1.1</text>
<rect x="74" y="258" width="24" height="20" rx="2" fill="#f3aa8d"/>
<text x="86" y="271" text-anchor="middle" font-size="8.5" fill="#0b0b0b">0.8</text>
