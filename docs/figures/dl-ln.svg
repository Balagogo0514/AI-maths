<text x="298" y="240" font-size="10" font-weight="700" fill="#2a78d6">Pre-LN：</text>
<text x="308" y="254" font-size="10" fill="#898781">• 梯度直通殘差，訓練穩定</text>
<text x="308" y="268" font-size="10" fill="#898781">• 可省略 Warmup</text>
<text x="298" y="282" font-size="10" font-weight="700" fill="#eb6834">Post-LN：</text>
<text x="308" y="296" font-size="10" fill="#898781">• 需要 Warmup</text>
<text x="308" y="310" font-size="10" fill="#898781">• 底層梯度易消失</text>
