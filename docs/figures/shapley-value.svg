<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310">
<rect width="580" height="310" fill="#fcfcfb" rx="8"/>
<text x="290" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b">Shapley Value：公平分配邊際貢獻</text>
<text x="290" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">範例：v({A,B,C})=9，計算各玩家在所有加入順序中邊際貢獻的平均</text>
<text x="24" y="62" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">聯盟值 v(S)</text>
<text x="34" y="80" font-family="monospace" font-size="10" fill="#0b0b0b">∅ = 0</text>
<text x="34" y="100" font-family="monospace" font-size="10" fill="#0b0b0b">{A} = 0</text>
<text x="34" y="120" font-family="monospace" font-size="10" fill="#0b0b0b">{B} = 0</text>
<text x="34" y="140" font-family="monospace" font-size="10" fill="#0b0b0b">{C} = 0</text>
<text x="34" y="160" font-family="monospace" font-size="10" fill="#0b0b0b">{A,B} = 5</text>
<text x="34" y="180" font-family="monospace" font-size="10" fill="#0b0b0b">{A,C} = 4</text>
<text x="34" y="200" font-family="monospace" font-size="10" fill="#0b0b0b">{B,C} = 3</text>
<text x="34" y="220" font-family="monospace" font-size="10" fill="#1baf7a">{A,B,C} = 9 ★</text>
<text x="200" y="62" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">6 種加入順序（邊際貢獻）</text>
<text x="200" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#898781">順序</text>
<text x="268" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#898781">A</text>
<text x="300" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#898781">B</text>
<text x="332" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#898781">C</text>
<text x="200" y="96" font-family="monospace" font-size="9" fill="#898781">A→B→C</text>
<text x="284" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">0</text>
<text x="316" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">5</text>
<text x="348" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">4</text>
<text x="200" y="116" font-family="monospace" font-size="9" fill="#898781">A→C→B</text>
<text x="284" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">0</text>
<text x="316" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">5</text>
<text x="348" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">4</text>
<text x="200" y="136" font-family="monospace" font-size="9" fill="#898781">B→A→C</text>
<text x="284" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">5</text>
<text x="316" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">0</text>
<text x="348" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">4</text>
<text x="200" y="156" font-family="monospace" font-size="9" fill="#898781">B→C→A</text>
<text x="284" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">6</text>
<text x="316" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">0</text>
<text x="348" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">3</text>
<text x="200" y="176" font-family="monospace" font-size="9" fill="#898781">C→A→B</text>
<text x="284" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">4</text>
<text x="316" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">5</text>
<text x="348" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">0</text>
<text x="200" y="196" font-family="monospace" font-size="9" fill="#898781">C→B→A</text>
<text x="284" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">6</text>
<text x="316" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">3</text>
<text x="348" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">0</text>
<line x1="264" y1="208" x2="360" y2="208" stroke="#c3c2b7" stroke-width="1"/>
<text x="284" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">Σ=21</text>
<text x="316" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2a78d6">Σ=18</text>
<text x="348" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">Σ=15</text>
<text x="458" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">Shapley Value φᵢ</text>
<rect x="390" y="109" width="52" height="133" fill="#eb6834" opacity="0.8" rx="4"/>
<text x="416" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#eb6834">3.5</text>
<text x="416" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b">玩家 A</text>
<rect x="458" y="128" width="52" height="114" fill="#2a78d6" opacity="0.8" rx="4"/>
<text x="484" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2a78d6">3.0</text>
<text x="484" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b">玩家 B</text>
<rect x="526" y="147" width="52" height="95" fill="#1baf7a" opacity="0.8" rx="4"/>
<text x="552" y="139" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1baf7a">2.5</text>
<text x="552" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b">玩家 C</text>
<text x="458" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">3.5+3.0+2.5 = 9.0 = v(N) ✓</text>
<text x="290" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">φᵢ = Σ [|S|!(n−|S|−1)!/n!]·[v(S∪{i}) − v(S)]，唯一滿足效率性、對稱性、虛擬玩家性、可加性的分配</text>
</svg>