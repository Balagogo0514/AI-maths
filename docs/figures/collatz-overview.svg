<line x1="218" y1="262" x2="624" y2="262" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="218" cy="262" r="2.4" fill="#2a78d6"/>
<circle cx="624" cy="262" r="2.4" fill="#2a78d6"/>
<text x="510.0" y="258.0" text-anchor="middle" font-size="7" font-weight="700" fill="#2a78d6">log₂3 與 √2 的連分數對比</text>
<rect x="12" y="302" width="796" height="34" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
<line x1="24" y1="313" x2="48" y2="313" stroke="#eb6834" stroke-width="2"/>
<text x="54.0" y="316.0" text-anchor="start" font-size="8" font-weight="400" fill="#0b0b0b">真實關係（可驗證）</text>
<line x1="168" y1="313" x2="192" y2="313" stroke="#7c56c8" stroke-width="2"/>
<text x="198.0" y="316.0" text-anchor="start" font-size="8" font-weight="400" fill="#0b0b0b">同屬 Lucas 序列</text>
<line x1="290" y1="313" x2="314" y2="313" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="320.0" y="316.0" text-anchor="start" font-size="8" font-weight="400" fill="#0b0b0b">類比／對比</text>
<text x="24.0" y="329.0" text-anchor="start" font-size="8" font-weight="400" fill="#898781">三個共同機制：① 2-進位貼近（−1 排斥、1 吸引）　② 2^k 與 3^s 的不可公度（連分數）　③ 漂移符號與臨界（q = 4）</text>
