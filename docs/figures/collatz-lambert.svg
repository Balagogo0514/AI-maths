<text x="154.0" y="170.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">N</text>
<text x="49.0" y="57.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">藍：b_N = S(N)/N − a(ln N − 1)　淺藍底：擬合範圍</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">b_N：10³ → -2.07，10⁴ → -0.65，10⁵ → -2.09，10⁶ → -2.21</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">擬合 N ∈ [10⁴, 10⁵]：b = -1.80（標準差 0.36）</text>
<text x="141.0" y="217.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">b 不是常數：擬合值只是範圍內的平均</text>
<text x="141.0" y="232.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">反解：u = ln N − 1 + b/a，u·e^u = (B/a)·e^(−1+b/a)</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">N = exp( 1 − b/a + W( (B/a)·e^(−1+b/a) ) )</text>
<text x="141.0" y="260.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">早停（降到 &lt; n 就停）每個 n 平均只要 3.48 步</text>
<text x="141.0" y="273.0" text-anchor="middle" font-size="8" font-weight="700" fill="#d94040">⇒ 實務驗證成本是線性的，用不到 W</text>
