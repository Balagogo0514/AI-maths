<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">成本模型：S(N) ≈ a(N ln N − N) + bN</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">S(N) = Σ_(n≤N) steps(n)，a = 10.428 = 1.5 / (½ ln(4/3))</text>
