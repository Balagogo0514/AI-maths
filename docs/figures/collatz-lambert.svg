<text x="684.0" y="251.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">M_n / M_(n−1)（n=300）= 2.985 → 3</text>
<text x="684.0" y="265.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Collatz 反向樹是固定的一棵樹，層級數 ~ λ^d（§3.9）</text>
<text x="684.0" y="277.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#d94040">⇒ 不是 Cayley 型計數，無 W</text>
