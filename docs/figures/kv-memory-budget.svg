<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">一個請求的 KV cache 有多大（GB）</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">每 token = 2 × 層數 × KV head × head 維度 × bytes</text>
<line x1="46.0" y1="150.0" x2="262.0" y2="150.0" stroke="#898781" stroke-width="0.8"/>
<line x1="46.0" y1="150.0" x2="46.0" y2="68.0" stroke="#898781" stroke-width="0.8"/>
<line x1="43.0" y1="146.0" x2="262.0" y2="146.0" stroke="#eee" stroke-width="0.6"/>
<text x="40.0" y="149.0" text-anchor="end" font-size="7" font-weight="400" fill="#898781">0.3</text>
<line x1="43.0" y1="134.3" x2="262.0" y2="134.3" stroke="#eee" stroke-width="0.6"/>
<text x="40.0" y="137.3" text-anchor="end" font-size="7" font-weight="400" fill="#898781">1</text>
<line x1="43.0" y1="111.9" x2="262.0" y2="111.9" stroke="#eee" stroke-width="0.6"/>
<text x="40.0" y="114.9" text-anchor="end" font-size="7" font-weight="400" fill="#898781">10</text>
<line x1="43.0" y1="89.5" x2="262.0" y2="89.5" stroke="#eee" stroke-width="0.6"/>
<text x="40.0" y="92.5" text-anchor="end" font-size="7" font-weight="400" fill="#898781">100</text>
<line x1="46.0" y1="91.6" x2="262.0" y2="91.6" stroke="#d94040" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="49.0" y="88.6" text-anchor="start" font-size="7" font-weight="700" fill="#d94040">一張 80 GB GPU</text>
<rect x="52.0" y="118.2" width="17" height="31.8" fill="#eb6834" opacity="0.85"/>
<rect x="72.0" y="138.4" width="17" height="11.6" fill="#2a78d6" opacity="0.85"/>
<rect x="92.0" y="145.2" width="17" height="4.8" fill="#1baf7a" opacity="0.85"/>
<text x="73.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">2,000</text>
<rect x="106.0" y="104.7" width="17" height="45.3" fill="#eb6834" opacity="0.85"/>
<rect x="126.0" y="124.9" width="17" height="25.1" fill="#2a78d6" opacity="0.85"/>
<rect x="146.0" y="131.7" width="17" height="18.3" fill="#1baf7a" opacity="0.85"/>
<text x="127.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">8,000</text>
<rect x="160.0" y="91.2" width="17" height="58.8" fill="#eb6834" opacity="0.85"/>
<rect x="180.0" y="111.4" width="17" height="38.6" fill="#2a78d6" opacity="0.85"/>
<rect x="200.0" y="118.2" width="17" height="31.8" fill="#1baf7a" opacity="0.85"/>
<text x="181.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">32,000</text>
<rect x="214.0" y="77.4" width="17" height="72.6" fill="#eb6834" opacity="0.85"/>
<rect x="234.0" y="97.7" width="17" height="52.3" fill="#2a78d6" opacity="0.85"/>
<rect x="254.0" y="104.4" width="17" height="45.6" fill="#1baf7a" opacity="0.85"/>
<text x="235.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">131,072</text>
<text x="154.0" y="170.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">上下文長度（token）</text>
<text x="49.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">橘：MHA　藍：GQA（基準）　綠：GQA + FP8</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#0b0b0b">基準（GQA、bf16）：每 token 327,680 B ≈ 320 KB</text>
<text x="141.0" y="204.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#2a78d6">2,000 → 0.66 GB　32,000 → 10.5 GB　131,072 → 43 GB</text>
<text x="141.0" y="218.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#eb6834">MHA（64 個 KV head）大 8 倍：2,000 個 token 就 5.24 GB</text>
<text x="141.0" y="232.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">FP8 約減半（可能損失品質，§12.5）</text>
<text x="141.0" y="246.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#d94040">長上下文時，單一請求的 cache 就能超過一張卡</text>
<text x="141.0" y="260.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">配置是我假設的 70B 等級模型（80 層），不是特定模型</text>
<text x="141.0" y="273.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">全部是算術，不是實測</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">一個節點能同時放幾個請求（粗估）</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">8 × 80 GB = 640 GB，權重 140 GB（70B、bf16），剩 500 GB 給 cache</text>
<rect x="322" y="60" width="47.7" height="18" fill="#eda100" opacity="0.6"/>
<rect x="369.7" y="60" width="170.3" height="18" fill="#2a78d6" opacity="0.5"/>
<text x="345.8" y="72.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">權重 140</text>
<text x="454.8" y="72.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">KV cache 池 500 GB（忽略 activation 與餘量）</text>
<line x1="322.0" y1="150.0" x2="540.0" y2="150.0" stroke="#898781" stroke-width="0.8"/>
<line x1="319.0" y1="150.0" x2="540.0" y2="150.0" stroke="#eee" stroke-width="0.6"/>
<text x="316.0" y="153.0" text-anchor="end" font-size="7" font-weight="400" fill="#898781">1</text>
<line x1="319.0" y1="133.3" x2="540.0" y2="133.3" stroke="#eee" stroke-width="0.6"/>
<text x="316.0" y="136.3" text-anchor="end" font-size="7" font-weight="400" fill="#898781">10</text>
<line x1="319.0" y1="116.7" x2="540.0" y2="116.7" stroke="#eee" stroke-width="0.6"/>
<text x="316.0" y="119.7" text-anchor="end" font-size="7" font-weight="400" fill="#898781">100</text>
<line x1="319.0" y1="100.0" x2="540.0" y2="100.0" stroke="#eee" stroke-width="0.6"/>
<text x="316.0" y="103.0" text-anchor="end" font-size="7" font-weight="400" fill="#898781">1000</text>
<rect x="334" y="102.0" width="34" height="48.0" fill="#1baf7a" opacity="0.85"/>
<text x="351.0" y="99.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#1baf7a">762</text>
<text x="351.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">2,000</text>
<rect x="386" y="112.0" width="34" height="38.0" fill="#1baf7a" opacity="0.85"/>
<text x="403.0" y="109.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#1baf7a">190</text>
<text x="403.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">8,000</text>
<rect x="438" y="122.0" width="34" height="28.0" fill="#1baf7a" opacity="0.85"/>
<text x="455.0" y="119.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#1baf7a">47</text>
<text x="455.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">32,000</text>
<rect x="490" y="132.2" width="34" height="17.8" fill="#1baf7a" opacity="0.85"/>
<text x="507.0" y="129.2" text-anchor="middle" font-size="7.6" font-weight="700" fill="#1baf7a">11</text>
<text x="507.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">131,072</text>
<text x="431.0" y="170.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">每個請求的上下文長度（token）</text>
<rect x="290" y="176" width="250" height="108" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="190.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">池子 500 GB ÷ 每個請求的 cache = 同時可放的請求數</text>
<text x="415.0" y="204.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">2,000 → 762；8,000 → 190；32,000 → 47；131,072 → 11</text>
<text x="415.0" y="218.0" text-anchor="middle" font-size="7.6" font-weight="700" fill="#0b0b0b">上下文越長，同時服務的人數越少</text>
<text x="415.0" y="232.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">這是上限的粗估：沒扣 activation、碎片與排程餘量</text>
<text x="415.0" y="246.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">超過上限的請求要排隊，或被搶占換出（§12.8）</text>
<text x="415.0" y="260.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">權重一份服務所有人，cache 才隨請求數線性成長</text>
<text x="415.0" y="273.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#d94040">（8 張 80 GB、70B 模型是假設的配置）</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">把 cache 壓小的手段（相對大小）</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">以 GQA、bf16 的 KV cache 為 1×</text>
<text x="568.0" y="68.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">完整 MHA（64 個 KV head）</text>
<rect x="690.0" y="71" width="76.3" height="6" fill="#eb6834" opacity="0.85"/>
<text x="769.3" y="77.0" text-anchor="start" font-size="7" font-weight="700" fill="#eb6834">8× 大</text>
<text x="568.0" y="90.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">GQA（8 個 KV head，基準）</text>
<rect x="690.0" y="93" width="41.8" height="6" fill="#2a78d6" opacity="0.85"/>
<text x="734.8" y="99.0" text-anchor="start" font-size="7" font-weight="700" fill="#2a78d6">1×</text>
<text x="568.0" y="112.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">GQA + FP8 的 KV</text>
<rect x="690.0" y="115" width="30.4" height="6" fill="#1baf7a" opacity="0.85"/>
<text x="723.4" y="121.0" text-anchor="start" font-size="7" font-weight="700" fill="#1baf7a">0.5×</text>
<text x="568.0" y="134.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">滑動視窗 4096（32000 上下文）</text>
<rect x="690.0" y="137" width="7.8" height="6" fill="#1baf7a" opacity="0.85"/>
<text x="700.8" y="143.0" text-anchor="start" font-size="7" font-weight="700" fill="#1baf7a">0.128×</text>
<text x="568.0" y="156.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">8 個請求共享 2000 token 前綴</text>
<rect x="690.0" y="159" width="12.2" height="6" fill="#1baf7a" opacity="0.85"/>
<text x="705.2" y="165.0" text-anchor="start" font-size="7" font-weight="700" fill="#1baf7a">0.167×</text>
<line x1="731.8" y1="66.0" x2="731.8" y2="166.0" stroke="#898781" stroke-width="0.8" stroke-dasharray="3,3"/>
<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="190.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">GQA：8 倍；FP8：減半（§7.1、§12.5）</text>
<text x="684.0" y="204.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">滑動視窗：cache 上限 = 視窗大小（§7.2）</text>
<text x="684.0" y="218.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#0b0b0b">前綴共享：8 請求共用 2000 token ⇒ 0.167×（§12.7 的算術例）</text>
<text x="684.0" y="232.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">分頁：不是縮小 cache，是減少浪費（玩具模擬使用率</text>
<text x="684.0" y="244.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">22% → 98%，§12.8）；各手段可疊加，但倍數不能直接相乘</text>
<text x="684.0" y="258.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#d94040">（品質與延遲的代價另計，也有實作成本，記憶）</text>
<text x="684.0" y="272.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#d94040">全部是算術或前面章節的玩具數字，不是實測</text>
</svg>