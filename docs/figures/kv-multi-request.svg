<text x="684.0" y="42.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">假設的長度分布，block = 16 token，池 = 16000 token</text>
<line x1="596.0" y1="150.0" x2="796.0" y2="150.0" stroke="#898781" stroke-width="0.8"/>
