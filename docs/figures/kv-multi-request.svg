<text x="141.0" y="174.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">每個請求有自己的 block table（邏輯 → 物理）</text>
<text x="141.0" y="188.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">attention 只依自己的 table 讀自己的 block</text>
<text x="141.0" y="202.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">兩請求一起算 vs 各自單獨算：最大差 2.2e-16（已驗證）</text>
<text x="141.0" y="216.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#d94040">若 B 誤讀 A 的 block：最大差 1.30（輸出被污染）</text>
<text x="141.0" y="230.0" text-anchor="middle" font-size="7.4" font-weight="400" fill="#898781">block 位置可以不連續、交錯，不影響結果</text>
<text x="141.0" y="244.0" text-anchor="middle" font-size="7.4" font-weight="400" fill="#898781">請求結束 ⇒ 歸還 block；新請求 ⇒ 向池子領取</text>
<text x="141.0" y="258.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">（示範用 8 維、block 大小 4，不是真實系統）</text>
<text x="141.0" y="271.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">權重共用、內容隔離、記憶體池共用（見 §12.8）</text>
