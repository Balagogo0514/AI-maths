<rect x="716" y="133.9" width="30" height="16.1" fill="#eb6834" opacity="0.85"/>
<text x="731.0" y="130.9" text-anchor="middle" font-size="7.4" font-weight="700" fill="#eb6834">7</text>
<text x="731.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">連續預留</text>
<rect x="754" y="72.0" width="30" height="78.0" fill="#1baf7a" opacity="0.85"/>
<text x="769.0" y="69.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">34</text>
<text x="769.0" y="160.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">分頁</text>
<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="190.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">請求總長平均 458 token（prompt 330 + 輸出 128）</text>
<text x="684.0" y="204.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#eb6834">連續預留：每個請求先留 2048 token，使用率 22.4%</text>
<text x="684.0" y="218.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">分頁：只浪費最後一個 block，浪費 1.6%</text>
<text x="684.0" y="232.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">池子容納 7 對 34 個請求（以最終長度算，約 4.9 倍）</text>
<text x="684.0" y="246.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#d94040">長度分布、2048 上限、池大小都是我假設的</text>
<text x="684.0" y="260.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#d94040">只展示分頁為何省記憶體，不是任何系統的實測</text>
<text x="684.0" y="273.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
