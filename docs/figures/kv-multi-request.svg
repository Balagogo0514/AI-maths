<text x="415.0" y="190.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">靜態批次：一個 batch 要等最長的請求結束才能換新</text>
<text x="415.0" y="204.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#1baf7a">連續批次：某個 slot 一空，下一輪就補上新請求</text>
<text x="415.0" y="218.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">同樣 30 個 token：靜態 14 輪，連續 9 輪（排程模擬）</text>
<text x="415.0" y="232.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">新請求先做 prefill，之後和大家一起 decode（記憶）</text>
<text x="415.0" y="246.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">忽略了 prefill 的成本與記憶體上限，只比 slot 使用率</text>
<text x="415.0" y="260.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">真實系統的排程更複雜（優先順序、搶占）（記憶）</text>
<text x="415.0" y="273.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
