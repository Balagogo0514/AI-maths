<text x="684.0" y="184.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#0b0b0b">完全平衡本身有代價（top-1 玩具模型，已驗證：模擬）</text>
<text x="684.0" y="199.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#eb6834">輕度偏斜：至少 12.5% 的 token 被迫改送（模擬 12.5%）</text>
<text x="684.0" y="213.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#eb6834">較重偏斜：至少 24.0% 的 token 被迫改送（模擬 23.9%）</text>
<text x="684.0" y="230.0" text-anchor="middle" font-size="6.4" font-weight="400" fill="#898781">= 各專家超出 1/E 的部分加總（與均勻分佈的全變差距離）</text>
<text x="684.0" y="245.0" text-anchor="middle" font-size="6.4" font-weight="400" fill="#0b0b0b">均勻路由下 cf=1.25 幾乎不丟 token → 練得平衡，上限幾乎免費</text>
<text x="684.0" y="259.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#d94040">真實 top-k 的代價會小很多；只說明結構性取捨</text>
