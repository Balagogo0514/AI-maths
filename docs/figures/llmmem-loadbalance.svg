<text x="415.0" y="254.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">係數太大 → 為平衡犧牲品質；太小 → 擋不住崩潰（記憶）</text>
<text x="415.0" y="268.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#d94040">只驗證了共享偏置這個自由度，非完整網路</text>
