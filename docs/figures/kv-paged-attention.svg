<text x="415.0" y="190.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">block 小：浪費少，但 table 與管理成本高</text>
<text x="415.0" y="204.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#1baf7a">B = 1：浪費 0%，平均 458 項；B = 16：1.6%，29.1 項</text>
