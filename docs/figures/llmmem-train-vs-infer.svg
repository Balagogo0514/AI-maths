<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">推論：權重固定、KV 隨負載長</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">70B 等級 GQA 模型、bf16（算術）</text>
<text x="24.0" y="62.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">1 請求 × 8K</text>
<rect x="24.0" y="66" width="62.7" height="16" fill="#1baf7a" opacity="0.85"/>
<rect x="86.7" y="66" width="1.2" height="16" fill="#2a78d6" opacity="0.85"/>
<text x="55.4" y="77.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="white">權重 140</text>
<text x="91.9" y="77.5" text-anchor="start" font-size="6.8" font-weight="700" fill="#2a78d6">KV 2.7</text>
<text x="24.0" y="98.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">32 請求 × 8K</text>
<rect x="24.0" y="102" width="62.7" height="16" fill="#1baf7a" opacity="0.85"/>
<rect x="86.7" y="102" width="38.5" height="16" fill="#2a78d6" opacity="0.85"/>
<text x="55.4" y="113.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="white">權重 140</text>
<text x="129.2" y="113.5" text-anchor="start" font-size="6.8" font-weight="700" fill="#2a78d6">KV 85.9</text>
<text x="24.0" y="134.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">1 請求 × 1M</text>
<rect x="24.0" y="138" width="62.7" height="16" fill="#1baf7a" opacity="0.85"/>
<rect x="86.7" y="138" width="146.8" height="16" fill="#2a78d6" opacity="0.85"/>
<text x="55.4" y="149.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="white">權重 140</text>
<text x="160.1" y="149.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="white">KV 327.7</text>
<text x="24.0" y="176.0" text-anchor="start" font-size="6.6" font-weight="400" fill="#898781">單位 GB（不含啟動值、暫存緩衝）</text>
<rect x="18" y="188" width="246" height="96" rx="4" fill="#1baf7a" opacity="0.07" stroke="#1baf7a" stroke-width="0.9"/>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">權重：所有請求共用，固定成本</text>
<text x="141.0" y="217.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">KV：每個請求各一份，隨請求數與長度增長</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">啟動值：逐層用完即丟，通常較小</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">權重 int4 約 35 GB；KV 量化再減半（§5.1、§12.5）</text>
<text x="141.0" y="262.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#d94040">啟動值與暫存緩衝的大小依實作而定（記憶）</text>
<text x="141.0" y="275.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">訓練：每個參數約 16 bytes 的狀態</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">混合精度 Adam，70B 參數（16 B/參數為記憶中的標準配置）</text>
<rect x="292.0" y="58" width="28.8" height="22" fill="#1baf7a" opacity="0.85"/>
<text x="306.4" y="72.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="white">140</text>
<rect x="320.8" y="58" width="28.8" height="22" fill="#2a78d6" opacity="0.85"/>
<text x="335.1" y="72.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="white">140</text>
<rect x="349.5" y="58" width="57.5" height="22" fill="#eda100" opacity="0.85"/>
<text x="378.2" y="72.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="white">280</text>
<rect x="407.0" y="58" width="57.5" height="22" fill="#eb6834" opacity="0.85"/>
<text x="435.8" y="72.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="white">280</text>
<rect x="464.5" y="58" width="57.5" height="22" fill="#d94040" opacity="0.85"/>
<text x="493.2" y="72.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="white">280</text>
<text x="292.0" y="96.0" text-anchor="start" font-size="7.6" font-weight="700" fill="#0b0b0b">合計 1.12 TB（模型狀態；未含啟動值）</text>
<rect x="296" y="108" width="9" height="9" fill="#1baf7a" opacity="0.85"/>
<text x="310.0" y="116.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#0b0b0b">bf16 權重：2 B/參數 → 140 GB</text>
<rect x="296" y="122" width="9" height="9" fill="#2a78d6" opacity="0.85"/>
<text x="310.0" y="130.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#0b0b0b">bf16 梯度：2 B/參數 → 140 GB</text>
<rect x="296" y="136" width="9" height="9" fill="#eda100" opacity="0.85"/>
<text x="310.0" y="144.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#0b0b0b">FP32 主權重：4 B/參數 → 280 GB</text>
<rect x="296" y="150" width="9" height="9" fill="#eb6834" opacity="0.85"/>
<text x="310.0" y="158.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#0b0b0b">Adam m：4 B/參數 → 280 GB</text>
<rect x="296" y="164" width="9" height="9" fill="#d94040" opacity="0.85"/>
<text x="310.0" y="172.0" text-anchor="start" font-size="7.1" font-weight="700" fill="#0b0b0b">Adam v：4 B/參數 → 280 GB</text>
<line x1="308.4" y1="46.0" x2="308.4" y2="56.0" stroke="#d94040" stroke-width="1.2"/>
<text x="311.4" y="53.0" text-anchor="start" font-size="6.4" font-weight="700" fill="#d94040">◀ 單張 GPU 80 GB</text>
<rect x="290" y="184" width="250" height="100" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="199.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">單張 80 GB GPU 放不下 1.12 TB → 一定要切分</text>
<text x="415.0" y="213.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#0b0b0b">啟動值（記憶的估算式 34·s·b·h 每層，s=4096、b=1）：</text>
<text x="415.0" y="225.0" text-anchor="middle" font-size="7.1" font-weight="700" fill="#eb6834">80 層約 91 GB（未做任何省法）</text>
<text x="415.0" y="239.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#0b0b0b">只存每層輸入、反向時重算：約 5.4 GB 加一層的量</text>
<text x="415.0" y="253.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">（activation checkpointing，以重算換記憶體）</text>
<text x="415.0" y="269.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#d94040">啟動值的估算式未在此驗證，依實作差異大</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">切分後：每張 GPU 的模型狀態</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">ZeRO-3／FSDP：權重、梯度、優化器狀態全部分片（算術）</text>
<text x="598.0" y="69.0" text-anchor="end" font-size="7.4" font-weight="700" fill="#0b0b0b">8 張</text>
<rect x="604.0" y="58" width="160.0" height="15" fill="#eb6834" opacity="0.85"/>
<text x="768.0" y="69.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#eb6834">140 GB</text>
<text x="598.0" y="95.0" text-anchor="end" font-size="7.4" font-weight="700" fill="#0b0b0b">64 張</text>
<rect x="604.0" y="84" width="20.0" height="15" fill="#1baf7a" opacity="0.85"/>
<text x="628.0" y="95.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#1baf7a">17.5 GB</text>
<text x="598.0" y="121.0" text-anchor="end" font-size="7.4" font-weight="700" fill="#0b0b0b">128 張</text>
<rect x="604.0" y="110" width="10.0" height="15" fill="#1baf7a" opacity="0.85"/>
<text x="618.0" y="121.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#1baf7a">8.8 GB</text>
<text x="598.0" y="147.0" text-anchor="end" font-size="7.4" font-weight="700" fill="#0b0b0b">512 張</text>
<rect x="604.0" y="136" width="2.5" height="15" fill="#1baf7a" opacity="0.85"/>
<text x="610.5" y="147.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#1baf7a">2.2 GB</text>
<line x1="695.4" y1="52.0" x2="695.4" y2="160.0" stroke="#d94040" stroke-width="1" stroke-dasharray="3,2"/>
<text x="697.4" y="168.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#d94040">80 GB</text>
<rect x="566" y="182" width="236" height="102" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="197.0" text-anchor="middle" font-size="7.1" font-weight="700" fill="#0b0b0b">切 8 張仍是 140 GB（放不下一張 80 GB）</text>
<text x="684.0" y="211.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">切 64 張以上才放得進，還要再留給啟動值</text>
<text x="684.0" y="225.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">代價：每步要額外通訊（收集權重、同步梯度）</text>
<text x="684.0" y="240.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#0b0b0b">LoRA：只訓練少量新增參數，省梯度與優化器狀態，</text>
<text x="684.0" y="252.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#0b0b0b">凍結的權重仍佔 140 GB（需量化才能省，記憶）</text>
<text x="684.0" y="268.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#d94040">不含通訊緩衝與啟動值</text>
</svg>