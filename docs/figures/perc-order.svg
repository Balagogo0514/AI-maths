<text x="287" y="72" font-size="10" fill="#eb6834" font-style="italic">β=5/36≈0.139</text>
<text x="210" y="272" text-anchor="middle" font-size="10" fill="#898781">佔據概率 p</text>
<text x="22" y="146" text-anchor="middle" font-size="10" fill="#898781" transform="rotate(-90,22,146)">P∞(p)</text>
<text x="58" y="60" font-size="10" font-weight="600" fill="#2a78d6">P∞ ~ (p−p_c)^β</text>
<text x="140" y="238" font-size="10" fill="#898781" font-style="italic">無貫通（P∞=0）</text>
<text x="280" y="76" font-size="10" fill="#2a78d6" font-style="italic">貫通相</text>
<rect x="415" y="10" width="395" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="612" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">臨界指數（2D 格點滲流）</text>
<rect x="425" y="36" width="378" height="16" rx="3" fill="#fcfcfb"/>
<text x="425" y="50" font-size="10" font-weight="700" fill="#898781">指數</text>
<text x="480" y="50" font-size="10" font-weight="700" fill="#898781">物理意義</text>
<text x="650" y="50" font-size="10" font-weight="700" fill="#898781">2D 值</text>
<text x="730" y="50" font-size="10" font-weight="700" fill="#898781">普適類</text>
<rect x="425" y="63" width="378" height="17" rx="2" fill="#f8f8f8"/>
<text x="435" y="74" font-size="11" font-weight="700" fill="#2a78d6" font-style="italic">β</text>
<text x="480" y="74" font-size="9.5" fill="#0b0b0b">P∞ ∼ (p−p_c)^β</text>
<text x="650" y="74" font-size="10" font-weight="600" fill="#2a78d6">5/36 ≈ 0.139</text>
<text x="435" y="92" font-size="11" font-weight="700" fill="#eb6834" font-style="italic">ν</text>
<text x="480" y="92" font-size="9.5" fill="#0b0b0b">ξ ∼ |p−p_c|^−ν</text>
<text x="650" y="92" font-size="10" font-weight="600" fill="#eb6834">4/3 ≈ 1.333</text>
<rect x="425" y="99" width="378" height="17" rx="2" fill="#f8f8f8"/>
<text x="435" y="110" font-size="11" font-weight="700" fill="#1baf7a" font-style="italic">τ</text>
<text x="480" y="110" font-size="9.5" fill="#0b0b0b">n_s ∼ s^−τ（臨界）</text>
<text x="650" y="110" font-size="10" font-weight="600" fill="#1baf7a">187/91 ≈ 2.055</text>
<text x="435" y="128" font-size="11" font-weight="700" fill="#7c56c8" font-style="italic">d_f</text>
<text x="480" y="128" font-size="9.5" fill="#0b0b0b">分形維數</text>
<text x="650" y="128" font-size="10" font-weight="600" fill="#7c56c8">91/48 ≈ 1.896</text>
<rect x="425" y="135" width="378" height="17" rx="2" fill="#f8f8f8"/>
<text x="435" y="146" font-size="11" font-weight="700" fill="#eda100" font-style="italic">σ</text>
<text x="480" y="146" font-size="9.5" fill="#0b0b0b">s_ξ ∼ |p−p_c|^−1/σ</text>
<text x="650" y="146" font-size="10" font-weight="600" fill="#eda100">36/91 ≈ 0.396</text>
<text x="435" y="164" font-size="11" font-weight="700" fill="#898781" font-style="italic">η</text>
<text x="480" y="164" font-size="9.5" fill="#0b0b0b">關聯函數衰減指數</text>
<text x="650" y="164" font-size="10" font-weight="600" fill="#898781">5/24 ≈ 0.208</text>
<rect x="425" y="188" width="378" height="68" rx="6" fill="#2a78d6" opacity="0.07" stroke="#2a78d6" stroke-width="1"/>
<text x="614" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#2a78d6">縮放關係（只有 2 個獨立指數）</text>
<text x="460" y="222" font-size="10" fill="#2a78d6" font-style="italic">d_f = d − β/ν</text>
<text x="580" y="222" font-size="10" fill="#2a78d6" font-style="italic">τ = 1 + d/d_f</text>
<text x="700" y="222" font-size="10" fill="#2a78d6" font-style="italic">2−η = d_f−(d−2)</text>
<text x="614" y="240" text-anchor="middle" font-size="9.5" fill="#898781">普適性：同一 d 與對稱性，不同微觀模型具有相同指數</text>
</svg>