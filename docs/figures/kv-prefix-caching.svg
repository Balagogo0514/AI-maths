<rect x="290" y="176" width="250" height="108" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="191.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">兩種不同後綴：前綴 K/V 兩層的最大差 = 0.0（已驗證）</text>
<text x="415.0" y="205.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#1baf7a">位置 &lt; 20：兩層都不變；位置 ≥ 20：第 2 層每個位置都變（≥ 0.019）</text>
<text x="415.0" y="219.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">第 1 層的 K/V 只取決於自己的 token 與位置，但更深的層會變</text>
<text x="415.0" y="233.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#eb6834">⇒ 從第一個不同的位置起，整段都要重算</text>
<text x="415.0" y="247.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#d94040">拿掉 causal mask（雙向）：第 2 層前綴 K 差 2.05，無法重用（§6.2）</text>
<text x="415.0" y="261.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">小型隨機模型的示範，不是真實 LLM</text>
<text x="415.0" y="274.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
