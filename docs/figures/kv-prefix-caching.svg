<text x="141.0" y="218.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#898781">block 雜湊串接：h1 = H(∅, S1)，h2 = H(h1, S2)，h3 = H(h2, S3)</text>
<text x="141.0" y="232.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">前綴相同 ⇒ 雜湊相同 ⇒ 直接重用 P1 P2 P3</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">第一個不同的 token 之後的 block 都要重算</text>
<text x="141.0" y="258.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">寫入共享 block 時採 copy-on-write（記憶）</text>
