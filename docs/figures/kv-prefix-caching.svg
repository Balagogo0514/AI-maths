<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="190.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">省 95% 的 prefill token（2000/2100）</text>
<text x="684.0" y="203.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">時間省得較少：新 token 仍要讀前綴的 K/V（§12.6）</text>
<text x="684.0" y="217.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">假設 80 層、8 KV head、d = 128、bf16：</text>
<text x="684.0" y="229.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">每 token 327,680 B ≈ 320 KB，2000 token ≈ 0.66 GB</text>
<text x="684.0" y="243.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#1baf7a">8 個請求：不共享 5.5 GB，共享約 0.9 GB</text>
<text x="684.0" y="257.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#d94040">（配置是假設的大模型，不是特定模型的實際值）</text>
<text x="684.0" y="270.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">只共享「完全相同的前綴」；變動內容放 prompt 最後</text>
