<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300">
<rect width="580" height="300" fill="#fcfcfb" rx="8"/>
<text x="290" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b">動態賽局樹：進入威脅與逆向歸納</text>
<line x1="290" y1="72" x2="430" y2="165" stroke="#2a78d6" stroke-width="3"/>
<text x="400" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2a78d6">進入</text>
<line x1="430" y1="165" x2="360" y2="240" stroke="#1baf7a" stroke-width="3"/>
<text x="400" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1baf7a">合作</text>
<line x1="290" y1="72" x2="150" y2="240" stroke="#898781" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="190" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#898781">不進入</text>
<line x1="430" y1="165" x2="500" y2="240" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="518" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#eb6834">打價格戰</text>
<circle cx="290" cy="72" r="14" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
<text x="290" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">新進入者</text>
<circle cx="430" cy="165" r="14" fill="#fef3ea" stroke="#eb6834" stroke-width="2"/>
<text x="430" y="149" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b">在位者</text>
<rect x="112" y="220" width="76" height="40" rx="6" fill="#898781" opacity="0.12" stroke="#898781" stroke-width="1.5"/>
<text x="150" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b">(0, 5)</text>
<text x="150" y="253" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#898781">新進,在位</text>
<rect x="322" y="220" width="76" height="40" rx="6" fill="#1baf7a" opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
<text x="360" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b">(3, 3)</text>
<text x="360" y="253" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#898781">新進,在位</text>
<text x="360" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1baf7a">✓ SPNE 結果</text>
<rect x="462" y="220" width="76" height="40" rx="6" fill="#eb6834" opacity="0.12" stroke="#eb6834" stroke-width="1.5"/>
<text x="500" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b">(−1, −1)</text>
<text x="500" y="253" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#898781">新進,在位</text>
<text x="500" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#eb6834">× 威脅不可信</text>
<text x="490" y="153" font-family="sans-serif" font-size="10" fill="#eb6834" font-style="italic">在位者：合作(3)＞打價格戰(-1)</text>
<text x="490" y="167" font-family="sans-serif" font-size="10" fill="#eb6834" font-style="italic">威脅不可信 → 新進者選進入</text>
<text x="290" y="286" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">逆向歸納：先解最後節點，再往根部推導 → 子賽局完美均衡（SPNE）</text>
<line x1="20" y1="250" x2="44" y2="250" stroke="#2a78d6" stroke-width="3"/>
<text x="50" y="254" font-family="sans-serif" font-size="10" fill="#0b0b0b">SPNE 路徑</text>
<line x1="130" y1="250" x2="154" y2="250" stroke="#898781" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="160" y="254" font-family="sans-serif" font-size="10" fill="#898781">均衡外路徑</text>
</svg>