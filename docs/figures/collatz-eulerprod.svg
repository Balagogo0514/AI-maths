<rect x="290" y="176" width="250" height="108" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="190.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">p = 5, 7, 11, 13, 17：實測與 1/p 四位小數全相符</text>
<text x="415.0" y="204.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">與 5, 7, 11, 13 互質：0.5754（預測 ∏(1−1/p) = 0.5754）</text>
<text x="415.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">與 5, …, 23 互質：0.4908（預測 0.4908）</text>
<text x="415.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">|偏差| ≤ 4e-05，比 σ（≥ 0.0045）小兩個數量級</text>
<text x="415.0" y="245.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">比隨機抽樣更均勻（確定性結構），不是更隨機；σ 只是尺度</text>
<text x="415.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">p = 2, 3 被結構拿掉（像與 6 互質，§3.13）</text>
<text x="415.0" y="271.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">每個與 6 互質的整數都能當像 ⇒ 檢查偏弱</text>
