<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Syracuse 像被 p 整除的比例對 1/p</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">奇數 n ≤ 4×10⁵ 的 (3n+1)/2^k，共 200,000 個</text>
