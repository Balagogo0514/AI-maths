<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">ℤ₂：Euler 乘積取遍 Lyndon 字</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">∏_k (1 − z^k)^(−L_k) = 1/(1 − 2z)，L_k = (1/k) Σ_(d|k) μ(k/d) 2^d</text>
