<text x="49.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">L_k：2, 1, 2, 3, 6, 9, 18, 30, 56, 99, 186, 335, 630, 1161</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">乘積展開到 z^14，係數恰為 2^n（已驗證）</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">Lyndon 字數：窮舉 k ≤ 12 與公式一致</text>
<text x="141.0" y="216.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">F₂ 上的不可約多項式：窮舉 deg ≤ 12，個數相同</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">⇒ ζ_T(z) 與 F₂[x] 的 zeta 是同一個式子（z = 2^(−s)）</text>
<text x="141.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">「質數」= 基本循環，函數域版 RH 平凡：</text>
<text x="141.0" y="256.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ζ = 1/(1 − 2^(1−s))，無零點，只有一個極點（記憶）</text>
<text x="141.0" y="271.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ℤ 上只剩 5 個因子（§3.13）</text>
