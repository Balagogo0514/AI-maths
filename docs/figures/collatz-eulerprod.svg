<text x="684.0" y="203.0" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">比值 0.9965（偏差約 0.35%）</text>
<text x="684.0" y="216.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">對照：與 6 互質整數的質數比例 0.2323，</text>
<text x="684.0" y="228.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">平均 3/ln m = 0.2325</text>
<text x="684.0" y="242.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">像的質數比例 0.2625，約是一般整數 1/ln m 的 3 倍</text>
<text x="684.0" y="256.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">這是啟發式，不是定理；對照組的比值 0.9993</text>
<text x="684.0" y="270.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">步數無 Euler 乘積（§3.14）；循環乘積是對元素取積</text>
