<text x="402" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#1baf7a">Score = ∇_x log p(x)</text>
<text x="402" y="199" text-anchor="middle" font-size="8.5" fill="#898781">「往哪個方向改圖，能讓它更真實？」</text>
<rect x="285" y="207" width="240" height="30" rx="4" fill="#1baf7a" opacity="0.09" stroke="#1baf7a" stroke-width="1"/>
<text x="405" y="219" text-anchor="middle" font-size="9" font-weight="700" fill="#1baf7a">去噪 ≡ 學習 Score Function</text>
<text x="405" y="231" text-anchor="middle" font-size="8" fill="#898781">最優去噪器 ε̂ ∝ −∇_x log p_σ(x)（Tweedie 公式）</text>
<rect x="285" y="243" width="240" height="40" rx="4" fill="#7c56c8" opacity="0.08" stroke="#7c56c8" stroke-width="0.8"/>
<text x="405" y="255" text-anchor="middle" font-size="9" font-weight="700" fill="#7c56c8">多尺度：難問題切成 T 個簡單問題</text>
<text x="291" y="268" font-size="8" fill="#898781">• 高噪聲 t≈T → 學全局結構（輪廓/構圖）</text>
<text x="291" y="279" font-size="8" fill="#898781">• 低噪聲 t≈0 → 學局部細節（紋理/邊緣）</text>
<rect x="544" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="677" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">生成模型大比較</text>
<rect x="550" y="36" width="253" height="22" rx="2" fill="#0b0b0b" opacity="0.07"/>
<text x="556" y="51" font-size="8" font-weight="700" fill="#0b0b0b">方法</text>
<text x="614" y="51" font-size="8" font-weight="700" fill="#0b0b0b">訓練穩定</text>
<text x="663" y="51" font-size="8" font-weight="700" fill="#0b0b0b">覆蓋分布</text>
<text x="714" y="51" font-size="8" font-weight="700" fill="#0b0b0b">生成品質</text>
<text x="754" y="51" font-size="8" font-weight="700" fill="#0b0b0b">速度</text>
<rect x="550" y="60" width="253" height="22" rx="2" fill="#d94040" opacity="0.06"/>
<text x="556" y="74" font-size="8.5" font-weight="700" fill="#d94040">GAN</text>
<text x="614" y="74" font-size="8" font-weight="400" fill="#d94040">✗ 不穩定</text>
<text x="663" y="74" font-size="8" font-weight="400" fill="#d94040">✗ 模式崩塌</text>
<text x="714" y="74" font-size="8" font-weight="400" fill="#898781">★★★★</text>
<text x="754" y="74" font-size="8" font-weight="400" fill="#1baf7a">★★★★★</text>
<rect x="550" y="82" width="253" height="22" rx="2" fill="#eb6834" opacity="0.06"/>
<text x="556" y="96" font-size="8.5" font-weight="700" fill="#eb6834">VAE</text>
<text x="614" y="96" font-size="8" font-weight="400" fill="#1baf7a">✓ 穩定</text>
<text x="663" y="96" font-size="8" font-weight="400" fill="#1baf7a">✓ 覆蓋全</text>
<text x="714" y="96" font-size="8" font-weight="400" fill="#898781">★★</text>
<text x="754" y="96" font-size="8" font-weight="400" fill="#1baf7a">★★★★★</text>
<rect x="550" y="104" width="253" height="22" rx="2" fill="#eda100" opacity="0.06"/>
<text x="556" y="118" font-size="8.5" font-weight="700" fill="#eda100">Flow</text>
<text x="614" y="118" font-size="8" font-weight="400" fill="#1baf7a">✓ 穩定</text>
<text x="663" y="118" font-size="8" font-weight="400" fill="#1baf7a">✓ 精確</text>
<text x="714" y="118" font-size="8" font-weight="400" fill="#898781">★★★</text>
<text x="754" y="118" font-size="8" font-weight="400" fill="#898781">★★★</text>
<rect x="550" y="126" width="253" height="22" rx="2" fill="#1baf7a" opacity="0.06"/>
<text x="556" y="140" font-size="8.5" font-weight="700" fill="#1baf7a">Diffusion</text>
<text x="614" y="140" font-size="8" font-weight="400" fill="#1baf7a">✓ 穩定</text>
<text x="663" y="140" font-size="8" font-weight="400" fill="#1baf7a">✓ 覆蓋全</text>
<text x="714" y="140" font-size="8" font-weight="400" fill="#1baf7a">★★★★★</text>
<text x="754" y="140" font-size="8" font-weight="400" fill="#898781">★★</text>
<text x="560" y="156" font-size="9.5" font-weight="700" fill="#1baf7a">Diffusion 為何訓練最穩定？</text>
<text x="556" y="170" font-size="8.5" fill="#898781">• 損失函數：MSE(ε̂ − ε)，回歸問題，非博弈</text>
<text x="556" y="183" font-size="8.5" fill="#898781">• 梯度訊號清晰：每步只預測「這一小步的噪聲」</text>
<text x="556" y="196" font-size="8.5" fill="#898781">• 無模式崩塌：每個時間步都有獨立梯度監督</text>
<rect x="550" y="213" width="253" height="44" rx="4" fill="#eda100" opacity="0.09" stroke="#eda100" stroke-width="0.8"/>
<text x="677" y="226" text-anchor="middle" font-size="9" font-weight="700" fill="#eda100">直覺比喻</text>
<text x="556" y="238" font-size="8.5" fill="#898781">GAN：要求新手直接畫傑作 → 壓力大</text>
<text x="556" y="250" font-size="8.5" fill="#1baf7a">Diffusion：先打草稿，再逐步細化 → 穩</text>
</svg>