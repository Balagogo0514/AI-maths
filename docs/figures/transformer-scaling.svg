<text x="620" y="225" text-anchor="end" font-size="8.5" fill="#898781">38.6+0.8+85</text>
<text x="798" y="225" text-anchor="end" font-size="9" fill="#1baf7a" font-weight="700">≈124M</text>
<rect x="432" y="242" width="370" height="68" rx="4" fill="#2a78d6" opacity="0.05" stroke="#2a78d6" stroke-width="0.8"/>
<text x="617" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#2a78d6">Scaling Law 關鍵結論（Kaplan 2020）</text>
<text x="436" y="268" font-size="8.5" fill="#2a78d6">Loss ∝ N⁻⁰·⁰⁷³（模型參數）×  D⁻⁰·⁰⁵⁰（資料量）</text>
<text x="436" y="282" font-size="8.5" fill="#eda100">Chinchilla（2022）：最優配比 D* = 20N（token 數 ≈ 20× 參數量）</text>
<text x="436" y="296" font-size="8.5" fill="#898781">相同計算預算下：增加深度（層數）比增加寬度（d_model）更有效率</text>
</svg>