<text x="620" y="203" text-anchor="end" font-size="8.5" fill="#898781">12 × 7.08M</text>
<text x="798" y="203" text-anchor="end" font-size="9" fill="#7c56c8" font-weight="700">85.0M</text>
<rect x="432" y="212" width="370" height="20" rx="2" fill="#1baf7a" opacity="0.18"/>
