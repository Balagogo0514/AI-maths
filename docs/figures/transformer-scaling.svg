<text x="210" y="217" text-anchor="middle" font-size="9.5" font-weight="700" fill="#eda100">Kaplan 2020 最優深寬比</text>
<text x="210" y="230" text-anchor="middle" font-size="8.5" fill="#898781">d_ff ≈ 4×d_model  |  d_k = d_model/H ≈ 64  |  深度增益 > 寬度增益（相同參數量）</text>
<rect x="425" y="10" width="385" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="617" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">GPT-2 small 參數計算走一遍</text>
