<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">鏈式法則：J 相乘</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">x → f → z → g → y → L（純量損失）</text>
<rect x="18" y="62" width="44" height="22" rx="5" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1"/>
<text x="40.0" y="77.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">x</text>
<rect x="78" y="62" width="44" height="22" rx="5" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1"/>
<text x="100.0" y="77.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">z = f(x)</text>
<rect x="148" y="62" width="44" height="22" rx="5" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1"/>
<text x="170.0" y="77.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">y = g(z)</text>
<rect x="213" y="62" width="44" height="22" rx="5" fill="#2a78d6" opacity="0.12" stroke="#2a78d6" stroke-width="1"/>
<text x="235.0" y="77.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">L</text>
<line x1="62.0" y1="73.0" x2="78.0" y2="73.0" stroke="#898781" stroke-width="1.2"/>
<line x1="78.0" y1="73.0" x2="73.7" y2="75.6" stroke="#898781" stroke-width="1.2"/>
<line x1="78.0" y1="73.0" x2="73.7" y2="70.4" stroke="#898781" stroke-width="1.2"/>
<text x="70.0" y="59.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#898781">J_f</text>
<line x1="122.0" y1="73.0" x2="148.0" y2="73.0" stroke="#898781" stroke-width="1.2"/>
<line x1="148.0" y1="73.0" x2="143.7" y2="75.6" stroke="#898781" stroke-width="1.2"/>
<line x1="148.0" y1="73.0" x2="143.7" y2="70.4" stroke="#898781" stroke-width="1.2"/>
<text x="135.0" y="59.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#898781">J_g</text>
<line x1="192.0" y1="73.0" x2="213.0" y2="73.0" stroke="#898781" stroke-width="1.2"/>
<line x1="213.0" y1="73.0" x2="208.7" y2="75.6" stroke="#898781" stroke-width="1.2"/>
<line x1="213.0" y1="73.0" x2="208.7" y2="70.4" stroke="#898781" stroke-width="1.2"/>
<text x="202.5" y="59.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#898781">∇L</text>
<text x="141.0" y="105.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#eb6834">前向模式（JVP）：u → J_f u → J_g (J_f u)</text>
<line x1="40.0" y1="112.0" x2="235.0" y2="112.0" stroke="#eb6834" stroke-width="1.4"/>
<line x1="235.0" y1="112.0" x2="230.7" y2="114.6" stroke="#eb6834" stroke-width="1.4"/>
<line x1="235.0" y1="112.0" x2="230.7" y2="109.4" stroke="#eb6834" stroke-width="1.4"/>
<text x="141.0" y="132.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#1baf7a">反向模式（VJP）：vᵀ → vᵀ J_g → (vᵀ J_g) J_f</text>
<line x1="235.0" y1="139.0" x2="40.0" y2="139.0" stroke="#1baf7a" stroke-width="1.4"/>
<line x1="40.0" y1="139.0" x2="44.3" y2="136.4" stroke="#1baf7a" stroke-width="1.4"/>
<line x1="40.0" y1="139.0" x2="44.3" y2="141.6" stroke="#1baf7a" stroke-width="1.4"/>
<rect x="18" y="150" width="246" height="134" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="165.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">J_(g∘f) = J_g · J_f（已驗證：誤差 3.3×10⁻¹⁰）</text>
<text x="141.0" y="180.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">兩個方向的乘法順序不同，結果相同，成本不同</text>
<text x="141.0" y="195.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">純量損失 L（m = 1）：一次反向傳播得到整個梯度</text>
<text x="141.0" y="210.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">∇L = J_Lᵀ，J_L 是 1×n 的列向量</text>
<text x="141.0" y="225.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">實作上不會寫出整個矩陣：</text>
<text x="141.0" y="238.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">4096 → 4096 的一層就有 4096² = 16,777,216 個元素</text>
<text x="141.0" y="252.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">只需要「J 乘向量」或「向量乘 J」這兩種操作</text>
<text x="141.0" y="266.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">自動微分（autograd）就是系統化地做這兩件事</text>
<text x="141.0" y="278.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">一層 tanh：J = diag(1 − tanh²z)·W</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">f(x) = tanh(Wx + b)，n = 5，m = 3（隨機種子 1）</text>
<text x="347.0" y="55.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">x1</text>
<text x="381.0" y="55.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">x2</text>
