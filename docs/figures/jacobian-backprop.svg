<text x="599.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">橘：前向模式（n 次 JVP）　綠：反向模式（m 次 VJP）</text>
<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="191.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">完整的 J 要 min(n, m) 次傳播（挑成本低的模式）</text>
<text x="684.0" y="205.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">輸出少、輸入多（損失函數 m = 1）→ 反向模式</text>
<text x="684.0" y="218.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#eb6834">輸入少、輸出多（n = 1）→ 前向模式</text>
<text x="684.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">神經網路訓練幾乎都是 m = 1，所以用反向傳播</text>
<text x="684.0" y="247.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">成本比較是依標準做法推算（記憶），沒有實測</text>
<text x="684.0" y="261.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">實測的是上面的恆等式與誤差</text>
