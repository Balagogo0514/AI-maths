<rect x="330" y="82" width="32" height="22" fill="#2a78d6" opacity="0.16" rx="3"/>
<text x="346.0" y="96.0" text-anchor="middle" font-size="7" font-weight="700" fill="#0b0b0b">+0.01</text>
