<text x="415.0" y="138.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">藍：正　橘：負（J 的 3×5 個元素）</text>
<rect x="290" y="150" width="250" height="134" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="415.0" y="165.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">⟨v, J u⟩ = ⟨Jᵀ v, u⟩（JVP 與 VJP 的對偶）</text>
<text x="415.0" y="180.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#2a78d6">⟨v, J u⟩ = 0.414471556</text>
<text x="415.0" y="193.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#2a78d6">⟨Jᵀ v, u⟩ = 0.414471556</text>
<text x="415.0" y="208.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">解析 J 與中央差分的最大誤差 1.4×10⁻¹⁰（已驗證）</text>
<text x="415.0" y="223.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">tanh 層的 J = 對角矩陣 diag(1 − tanh² z) 乘 W</text>
<text x="415.0" y="237.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">對角矩陣乘法只是逐元素縮放，不需要建出矩陣</text>
<text x="415.0" y="251.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">→ 反向傳播逐層乘上 diag(…)·Wᵀ</text>
<text x="415.0" y="265.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">這是 Backpropagation.md 的核心（記憶：標準做法）</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">算出整個雅可比矩陣要幾次？</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">f: ℝⁿ → ℝᵐ（每次傳播的成本約為一次前向）</text>
