<text x="325.0" y="121.0" text-anchor="end" font-size="7" font-weight="700" fill="#898781">f3</text>
<rect x="330" y="106" width="32" height="22" fill="#2a78d6" opacity="0.24" rx="3"/>
<text x="346.0" y="120.0" text-anchor="middle" font-size="7" font-weight="700" fill="#0b0b0b">+0.15</text>
