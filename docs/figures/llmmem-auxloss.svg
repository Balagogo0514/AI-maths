<text x="415.0" y="257.0" text-anchor="middle" font-size="6.6" font-weight="400" fill="#0b0b0b">α = 10、30 不單調：f 是離散計數、每步重估，</text>
<text x="415.0" y="268.0" text-anchor="middle" font-size="6.6" font-weight="400" fill="#898781">太強的拉力讓路由擺盪（此玩具的現象，非真實模型）</text>
<text x="415.0" y="279.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">變體、系統意義與限制</text>
<rect x="566" y="40" width="236" height="24" rx="4" fill="#1baf7a" opacity="0.08" stroke="#1baf7a" stroke-width="0.9"/>
<text x="572.0" y="50.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#0b0b0b">z-loss</text>
<text x="572.0" y="60.0" text-anchor="start" font-size="6.4" font-weight="400" fill="#898781">懲罰 log-sum-exp 的平方，防分數過大</text>
<rect x="566" y="68" width="236" height="24" rx="4" fill="#2a78d6" opacity="0.08" stroke="#2a78d6" stroke-width="0.9"/>
<text x="572.0" y="78.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#0b0b0b">序列 vs 批次層級</text>
<text x="572.0" y="88.0" text-anchor="start" font-size="6.4" font-weight="400" fill="#898781">批次層級允許不同領域各偏好專家</text>
<rect x="566" y="96" width="236" height="24" rx="4" fill="#2a78d6" opacity="0.08" stroke="#2a78d6" stroke-width="0.9"/>
<text x="572.0" y="106.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#0b0b0b">裝置層級平衡</text>
<text x="572.0" y="116.0" text-anchor="start" font-size="6.4" font-weight="400" fill="#898781">直接對應專家並行的 straggler</text>
<rect x="566" y="124" width="236" height="24" rx="4" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="0.9"/>
<text x="572.0" y="134.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#0b0b0b">偏置調整（無輔助損失）</text>
<text x="572.0" y="144.0" text-anchor="start" font-size="6.4" font-weight="400" fill="#898781">不加損失項，避免梯度干擾</text>
<text x="684.0" y="160.0" text-anchor="middle" font-size="6.4" font-weight="700" fill="#1baf7a">z-loss 梯度 2·z·softmax(l)：與數值微分最大誤差 5e-09（已驗證）</text>
<rect x="566" y="170" width="236" height="114" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="184.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">系統面（記憶）</text>
<text x="574.0" y="198.0" text-anchor="start" font-size="6.5" font-weight="400" fill="#0b0b0b">• 只在訓練時存在；推論時的平衡靠學到的行為</text>
<text x="574.0" y="212.0" text-anchor="start" font-size="6.5" font-weight="400" fill="#0b0b0b">• 平衡好 → 每個專家的 HBM 都物有所值</text>
<text x="574.0" y="226.0" text-anchor="start" font-size="6.5" font-weight="400" fill="#0b0b0b">• 平衡好 → 專家並行的最忙 GPU 更接近平均</text>
<text x="574.0" y="240.0" text-anchor="start" font-size="6.5" font-weight="400" fill="#0b0b0b">• 與容量上限互補：訓練拉平、系統設上界</text>
<text x="574.0" y="254.0" text-anchor="start" font-size="6.5" font-weight="700" fill="#d94040">• 上表變體的定義與係數：只憑印象、未查證</text>
<text x="684.0" y="276.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
