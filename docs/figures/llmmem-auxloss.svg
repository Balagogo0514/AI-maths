<text x="141.0" y="225.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#0b0b0b">均勻 1.0、偏斜 1.84、全落在單一專家 8.0</text>
<text x="141.0" y="238.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#898781">10 萬組隨機分佈中，E·Σ p² 最小為 1.019，沒有低於 1</text>
<text x="141.0" y="252.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#0b0b0b">梯度方向（§5.4 已驗證）：忙的專家被壓低、閒的被拉高</text>
<text x="141.0" y="266.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#d94040">式子的標準形式為記憶中的 Switch 風格，未查證原文</text>
