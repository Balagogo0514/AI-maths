<text x="141.0" y="132.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">2-進位：÷2 擴張（位移，產生位元）</text>
<text x="141.0" y="143.0" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">3-進位：×3 收縮（遺忘初值）</text>
<line x1="22" y1="152" x2="260" y2="152" stroke="#e8e8e8" stroke-width="1"/>
<text x="141.0" y="166.0" text-anchor="middle" font-size="9" font-weight="700" fill="#0b0b0b">x ↦ 3x+1 在 ℤ₃：不動點 −1/2</text>
<text x="141.0" y="178.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">從 x₀=0 迭代：0, 1, 4, 13, 40, 121…</text>
<text x="24.0" y="192.0" text-anchor="start" font-size="8" font-weight="400" fill="#898781">到 −1/2 的 3-進位距離</text>
