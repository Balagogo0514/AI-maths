<text x="415.0" y="226.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#0b0b0b">檢驗 n &lt; 4×10⁵ 的奇數：共 3651 種模式，</text>
<text x="415.0" y="238.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">每種模式都只對應 1 個餘數</text>
