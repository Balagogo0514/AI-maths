<text x="69.2" y="265.0" text-anchor="start" font-size="7.5" font-weight="700" fill="#2a78d6">1/243</text>
<text x="141.0" y="280.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">實測：3 的倍數永遠進不來（n ≤ 2×10⁵ 無例外）</text>
<rect x="284" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">2-進位模式決定 3-進位位置</text>
<rect x="292" y="36" width="246" height="38" rx="4" fill="#7c56c8" opacity="0.07" stroke="#7c56c8" stroke-width="0.9"/>
<text x="415.0" y="51.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0b0b0b">Syr^k(n) · 2^A = 3^k · n + c</text>
<text x="415.0" y="66.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">c、A 只由各步的 2-進位賦值 (v₁…v_k) 決定</text>
<text x="415.0" y="90.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c56c8">⇒ mod 3^k：3^k·n 項消失，餘數 = c·2^(−A)，與 n 無關</text>
<text x="415.0" y="108.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">k = 4，模式 (v₁,v₂,v₃,v₄) = (1, 4, 2, 2)</text>
<text x="300.0" y="124.0" text-anchor="start" font-size="8" font-weight="700" fill="#898781">n</text>
<text x="366.0" y="124.0" text-anchor="end" font-size="8" font-weight="700" fill="#898781">Syr^4(n)</text>
<text x="440.0" y="124.0" text-anchor="end" font-size="8" font-weight="700" fill="#898781">mod 81</text>
