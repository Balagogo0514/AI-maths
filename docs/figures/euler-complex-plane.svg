<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" font-family="system-ui,-apple-system,Segoe UI,PingFang TC,Microsoft JhengHei,sans-serif" role="img" aria-label="歐拉公式在複數平面上的幾何詮釋"><rect x="0.5" y="0.5" width="559" height="519" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="20" y="28" fill="#0b0b0b" font-size="15" font-weight="600">歐拉公式：e^(iθ) 在複數平面上的幾何意義</text><line x1="77" y1="265" x2="483" y2="265" stroke="#c3c2b7" stroke-width="1.8"/><line x1="280" y1="468" x2="280" y2="62" stroke="#c3c2b7" stroke-width="1.8"/><text x="489" y="269" fill="#52514e" font-size="13" dominant-baseline="middle">Re</text><text x="284" y="60" fill="#52514e" font-size="13">Im</text><circle cx="280" cy="265" r="185" fill="none" stroke="#52514e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.5"/><circle cx="465.0" cy="265.0" r="5" fill="#1baf7a"/><text x="475.0" y="269.0" fill="#1baf7a" font-size="13" font-weight="600">e^{i·0}=1</text><circle cx="280.0" cy="80.0" r="5" fill="#eb6834"/><text x="286.0" y="66.0" fill="#eb6834" font-size="13" font-weight="600">e^{iπ/2}=i</text><circle cx="95.0" cy="265.0" r="5" fill="#2a78d6"/><text x="-17.0" y="269.0" fill="#2a78d6" font-size="13" font-weight="600">e^{iπ}=−1</text><circle cx="280.0" cy="450.0" r="5" fill="#eda100"/><text x="285.99999999999994" y="466.0" fill="#eda100" font-size="13" font-weight="600">e^{i3π/2}=−i</text><line x1="280" y1="265" x2="95.0" y2="265" stroke="#2a78d6" stroke-width="2"/><line x1="280" y1="265" x2="161.1" y2="123.3" stroke="#0b0b0b" stroke-width="2"/><circle cx="161.1" cy="123.3" r="5" fill="#0b0b0b" opacity="0.5"/><path d="M 324 265 A 44 44 0 0 0 251.7 231.3" fill="none" stroke="#0b0b0b" stroke-width="1.5"/><text x="336" y="259" fill="#0b0b0b" font-size="13">θ</text><text x="169.1" y="117.3" fill="#0b0b0b" font-size="12">e^(iθ)=cosθ+i sinθ</text><text x="471" y="279" fill="#898781" font-size="11">1</text><text x="77" y="279" fill="#898781" font-size="11">−1</text><text x="262" y="84" fill="#898781" font-size="11" text-anchor="end">i</text><text x="262" y="454" fill="#898781" font-size="11" text-anchor="end">−i</text><text x="280" y="506" fill="#52514e" font-size="12" text-anchor="middle">e^(iπ)+1=0　←　Euler 恆等式（θ=π 時）</text></svg>