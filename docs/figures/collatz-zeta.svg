<text x="684.0" y="192.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">Dirichlet 級數留數 = 密度（Abelian 方向，記憶）</text>
<text x="684.0" y="205.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">與 6 互質：ζ(s)(1 − 2^(−s))(1 − 3^(−s))，留數 1/3</text>
<text x="684.0" y="218.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">收斂很慢（誤差約 1/ln x）：只是相容，不算驗證</text>
<text x="684.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">奇數 n ≤ 3×10⁵：T(n) 與 6 互質（0 例外），模 6 為 1 或 5</text>
<text x="684.0" y="246.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">= §3.2「3 的倍數進不來」，即拿掉 Euler 因子 p = 2, 3</text>
<text x="684.0" y="262.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#d94040">ζ 的零點、黎曼猜想：與 Collatz 無已知關係</text>
<text x="684.0" y="275.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">（我沒有查文獻）</text>
