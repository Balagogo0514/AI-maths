<text x="170.0" y="170.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">k（週期長度的上界）</text>
<text x="55.0" y="62.0" text-anchor="start" font-size="8" font-weight="700" fill="#2a78d6">藍：ℤ₂ 的週期點數 2^k</text>
<text x="55.0" y="73.0" text-anchor="start" font-size="8" font-weight="700" fill="#eb6834">橘：整數解（正＋負＋零）</text>
<rect x="18" y="176" width="276" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="156.0" y="190.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">ℤ₂：D = 2^k − 3^s 恆為奇數 ⇒ c/D ∈ ℤ₂</text>
<text x="156.0" y="203.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2a78d6">每個奇偶模式恰一個週期點：ζ_T(z) = 1/(1 − 2z)</text>
<text x="156.0" y="218.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#eb6834">k = 18：ℤ₂ 有 262,144 個，整數只有 7 個</text>
<text x="156.0" y="232.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">正整數：偶數 k 為 2、奇數 k 為 0（k ≤ 18 窮舉）</text>
<text x="156.0" y="245.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c56c8">級數到 z^18 恰為 1/(1 − z²)</text>
<text x="156.0" y="260.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">⇔ 沒有非平凡正循環（只涵蓋循環，不含發散）</text>
<text x="156.0" y="273.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">N_k 含所有長度整除 k 的循環</text>
<rect x="314" y="10" width="232" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="430.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">循環的 Euler 乘積</text>
<text x="430.0" y="42.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">ζ_T(z) = ∏ (1 − z^|γ|)^(−1)，γ 取遍基本循環</text>
