<text x="32.0" y="206.0" text-anchor="end" font-size="6.4" font-weight="700" fill="#0b0b0b">序列 8</text>
<rect x="38.0" y="197" width="165.5" height="7" fill="#eb6834" opacity="0.85"/>
<rect x="38.0" y="205" width="53.2" height="7" fill="#1baf7a" opacity="0.85"/>
<text x="206.5" y="204.0" text-anchor="start" font-size="5.9" font-weight="700" fill="#eb6834">43.5</text>
<text x="94.2" y="212.0" text-anchor="start" font-size="5.9" font-weight="700" fill="#1baf7a">14.0</text>
<text x="38.0" y="222.0" text-anchor="start" font-size="6.5" font-weight="700" fill="#eb6834">■ 到達順序　</text>
<text x="100.0" y="222.0" text-anchor="start" font-size="6.5" font-weight="700" fill="#1baf7a">■ 依 Router 權重優先</text>
<rect x="18" y="232" width="246" height="52" rx="4" fill="#d94040" opacity="0.06" stroke="#d94040" stroke-width="0.9"/>
<text x="141.0" y="245.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#0b0b0b">總丟棄量相同（約 14.2%），但到達順序把損失</text>
<text x="141.0" y="257.0" text-anchor="middle" font-size="6.9" font-weight="700" fill="#d94040">全壓在最後幾條序列：第 8 條丟 43.5%，前 4 條 0%</text>
<text x="141.0" y="270.0" text-anchor="middle" font-size="6.7" font-weight="400" fill="#898781">同一個請求因排在批次的位置不同，品質不同</text>
<text x="141.0" y="281.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">對輸出的影響與對批次的依賴</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">32 維隨機線性專家（玩具），與 dropless 比較</text>
<text x="290.0" y="58.0" text-anchor="start" font-size="7.0" font-weight="700" fill="#0b0b0b">相對輸出誤差（不含殘差連線）</text>
<text x="330.0" y="74.0" text-anchor="end" font-size="6.6" font-weight="700" fill="#0b0b0b">到達順序</text>
<rect x="336.0" y="64" width="119.2" height="13" fill="#eb6834" opacity="0.85"/>
<text x="459.2" y="74.0" text-anchor="start" font-size="7.0" font-weight="700" fill="#eb6834">0.397</text>
<text x="330.0" y="94.0" text-anchor="end" font-size="6.6" font-weight="700" fill="#0b0b0b">依權重優先</text>
<rect x="336.0" y="84" width="61.9" height="13" fill="#1baf7a" opacity="0.85"/>
<text x="401.9" y="94.0" text-anchor="start" font-size="7.0" font-weight="700" fill="#1baf7a">0.206</text>
<text x="415.0" y="116.0" text-anchor="middle" font-size="6.4" font-weight="400" fill="#898781">至少丟了一個專家的 token：到達 26.6%、權重優先 28.5%（差不多）</text>
<text x="290.0" y="134.0" text-anchor="start" font-size="7.0" font-weight="700" fill="#0b0b0b">丟棄狀態改變的 token 比例</text>
<text x="290.0" y="150.0" text-anchor="start" font-size="6.7" font-weight="700" fill="#0b0b0b">打亂序列順序</text>
<rect x="294" y="154" width="112" height="16" rx="4" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="0.9"/>
<text x="350.0" y="165.5" text-anchor="middle" font-size="6.7" font-weight="700" fill="#eb6834">到達順序 32.8%</text>
<rect x="412" y="154" width="112" height="16" rx="4" fill="#1baf7a" opacity="0.1" stroke="#1baf7a" stroke-width="0.9"/>
<text x="468.0" y="165.5" text-anchor="middle" font-size="6.7" font-weight="700" fill="#1baf7a">權重優先 0.0%</text>
<text x="290.0" y="186.0" text-anchor="start" font-size="6.7" font-weight="700" fill="#0b0b0b">換掉 1 條序列（其餘 token）</text>
<rect x="294" y="190" width="112" height="16" rx="4" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="0.9"/>
<text x="350.0" y="201.5" text-anchor="middle" font-size="6.7" font-weight="700" fill="#eb6834">到達順序 1.4%</text>
<rect x="412" y="190" width="112" height="16" rx="4" fill="#1baf7a" opacity="0.1" stroke="#1baf7a" stroke-width="0.9"/>
<text x="468.0" y="201.5" text-anchor="middle" font-size="6.7" font-weight="700" fill="#1baf7a">權重優先 1.2%</text>
<rect x="290" y="216" width="250" height="68" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="415.0" y="229.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#0b0b0b">權重優先的輸出誤差約為一半；且與排列順序無關</text>
<text x="415.0" y="242.0" text-anchor="middle" font-size="6.5" font-weight="400" fill="#0b0b0b">兩者都依賴批次組成：換一條序列，約 1% 的其他 token 受影響</text>
<text x="415.0" y="255.0" text-anchor="middle" font-size="6.5" font-weight="400" fill="#898781">與 Expert Choice（§5.5）同類的 token 間相依，程度小得多</text>
<text x="415.0" y="269.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#d94040">隨機線性專家非訓練好的模型，只比較相對大小</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">固定容量 vs Dropless</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">偏斜路由、1024 token、8 專家 top-2（模擬）</text>
<text x="580.0" y="60.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
<text x="676.0" y="58.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#eb6834">固定容量 cf=1.25</text>
<text x="756.0" y="58.0" text-anchor="middle" font-size="6.7" font-weight="700" fill="#1baf7a">Dropless</text>
<rect x="566" y="68" width="236" height="22" rx="4" fill="#898781" opacity="0.06" stroke="#898781" stroke-width="0.9"/>
<text x="570.0" y="82.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">被丟棄比例</text>
<text x="682.0" y="82.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#eb6834">14.2%</text>
<text x="762.0" y="82.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1baf7a">0%</text>
<rect x="566" y="94" width="236" height="22" rx="4" fill="#898781" opacity="0.06" stroke="#898781" stroke-width="0.9"/>
<text x="570.0" y="108.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">步驟時間（÷平均）</text>
<text x="682.0" y="108.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#eb6834">約 1.25</text>
<text x="762.0" y="108.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1baf7a">約 2.19</text>
<rect x="566" y="120" width="236" height="22" rx="4" fill="#898781" opacity="0.06" stroke="#898781" stroke-width="0.9"/>
<text x="570.0" y="134.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">補零浪費</text>
<text x="682.0" y="134.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#eb6834">有（利用率 68.6%）</text>
<text x="762.0" y="134.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1baf7a">無</text>
<rect x="566" y="146" width="236" height="22" rx="4" fill="#898781" opacity="0.06" stroke="#898781" stroke-width="0.9"/>
<text x="570.0" y="160.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#0b0b0b">形狀</text>
<text x="682.0" y="160.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#eb6834">固定</text>
<text x="762.0" y="160.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1baf7a">可變</text>
<rect x="566" y="176" width="236" height="108" rx="4" fill="#eb6834" opacity="0.06" stroke="#eb6834" stroke-width="0.9"/>
<text x="684.0" y="190.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">dropless 把代價從品質換成時間</text>
<text x="684.0" y="203.0" text-anchor="middle" font-size="6.6" font-weight="400" fill="#0b0b0b">不丟 token，但最忙的專家（或 GPU）決定步驟時間</text>
<text x="684.0" y="216.0" text-anchor="middle" font-size="6.6" font-weight="400" fill="#0b0b0b">固定容量反過來：用丟棄換一個時間上界</text>
<text x="684.0" y="230.0" text-anchor="middle" font-size="6.5" font-weight="400" fill="#898781">訓練丟、推論不丟 → 可能有落差（記憶，未驗證）</text>
<text x="684.0" y="243.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#d94040">dropless 的可變形狀實作只憑印象，未查證</text>
<text x="684.0" y="257.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#d94040">沒有量測丟棄對真實模型品質的影響</text>
<text x="684.0" y="271.0" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1baf7a">路由越平衡，兩者差距越小（§5.4）</text>
</svg>