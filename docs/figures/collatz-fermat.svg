<text x="164.0" y="214.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">=§3.3 崩落極端數 1, 5, 21, 85, … 中 i = 2^n 的項</text>
<text x="164.0" y="228.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">雙倍公式：U_(2m) = U_m · V_m ⇒ M_(2m) = M_m · F</text>
<text x="164.0" y="241.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">（U_(2m) = U_m V_m，m &lt; 40 已驗證）</text>
<text x="164.0" y="256.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">Mersenne 指數 k = 2^n 時：T^k(2^k−1) = 3^k − 1（n ≤ 8），</text>
<text x="164.0" y="268.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c56c8">v₂(3^(2^n) − 1) = n + 2（n ≤ 11 已驗證）</text>
