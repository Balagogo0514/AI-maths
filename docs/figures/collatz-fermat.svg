<text x="164.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Fermat 數的乘積恆等式</text>
<text x="164.0" y="42.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">F_n = 2^(2^n) + 1 = V_(2^n)(3,2)；2^m − 1 = U_m(3,2)</text>
<rect x="18" y="50" width="292" height="38" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="164.0" y="64.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">2^(2^n) − 1 = F₀·F₁·⋯·F_(n−1)　（n ≤ 12 已驗證）</text>
<text x="164.0" y="78.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#eb6834">(4^(2^n) − 1)/3 = F₁·F₂·⋯·F_n　（n ≤ 11 已驗證）</text>
<text x="24.0" y="106.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#898781">n</text>
<text x="46.0" y="106.0" text-anchor="start" font-size="7.5" font-weight="700" fill="#898781">F_n</text>
<text x="116.0" y="106.0" text-anchor="start" font-size="7.5" font-weight="700" fill="#898781">∏_(k=1..n) F_k = (4^(2^n)−1)/3</text>
<text x="266.0" y="106.0" text-anchor="start" font-size="7.5" font-weight="700" fill="#898781">標準版步數</text>
<rect x="18" y="110" width="292" height="15" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.4"/>
