<rect x="338" y="206" width="220" height="78" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="448.0" y="220.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0b0b">T^(2j)(1 + 2^N) = 1 + 3^j · 2^(N−2j)</text>
<text x="448.0" y="232.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">（2j ≤ N，N ≤ 40 已驗證）</text>
<text x="448.0" y="246.0" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">F_n：T^(2^n)(F_n) = 1 + 3^(2^(n−1))，v₂ = 1（n=2…8）</text>
<text x="448.0" y="259.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">前 2^n 位奇偶向量為 (10)^(2^(n−1))（n=3…6 已驗證）</text>
