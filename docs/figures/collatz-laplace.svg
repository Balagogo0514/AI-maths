<text x="49.0" y="56.0" text-anchor="start" font-size="7" font-weight="700" fill="#0b0b0b">藍：實測平均（每尺度 20000 個 n）　橘虛線：6.952 ln n</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">T 到 1 的步數，n ∈ [N, 2N]，N = 10³ … 10⁷</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#1baf7a">相鄰尺度的斜率：6.80、6.93、6.93、6.97</text>
<text x="141.0" y="216.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">預測 6.952 = 10.43 / 1.5（§5 標準映射的 10.43）</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">預測值比實測平均高約 1 步（常數項）</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="8" font-weight="700" fill="#1baf7a">平均上吻合（隨機模型的 Laplace 型預測）</text>
<text x="141.0" y="259.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">矩母函數 E[z^τ] ≈ n^(−θ(z))，θ 解 z·M(θ) = 1（推導，記憶）</text>
<text x="141.0" y="272.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">只是數值吻合，不是證明；真實奇偶性並非獨立</text>
