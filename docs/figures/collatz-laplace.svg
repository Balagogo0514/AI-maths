<rect x="566" y="176" width="236" height="108" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="684.0" y="190.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">d = 50…53：0.2339、0.2340、0.2342、0.2340</text>
<text x="684.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">§3.9 的 λ = (1 + √(7/3))/2，ln λ = 0.2341（吻合）</text>
<text x="684.0" y="217.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Σ_d |L_d| e^(−sd) 在 s &gt; 0.2341 收斂（已驗證）</text>
<text x="684.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">週期軌道：N_k = 2^k，ζ_T = 1/(1−2z) 極點在 z = ½</text>
<text x="684.0" y="244.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">⇒ 橫坐標 s = ln 2（拓撲熵，§3.13、§3.19）</text>
<text x="684.0" y="258.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">Laplace 方法 = Stirling（§3.9），通用</text>
<text x="684.0" y="272.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d94040">無已知結果把軌道或猜想本身連到 Laplace 變換</text>
