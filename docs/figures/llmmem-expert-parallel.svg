<text x="170.0" y="158.0" text-anchor="start" font-size="6.6" font-weight="700" fill="#1baf7a">■ 專家</text>
<text x="18.0" y="172.0" text-anchor="start" font-size="6.8" font-weight="400" fill="#898781">每張 GPU 的權重（EP 不超過專家數 8）</text>
<rect x="18" y="182" width="246" height="102" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="197.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">MoE 是結構，專家並行是放法與執行方式</text>
<text x="141.0" y="211.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">專家是最自然的切分單位：權重不動，</text>
<text x="141.0" y="223.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">token 去找專家</text>
<text x="141.0" y="237.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">一個專家 352 MB；某專家一步要處理約 21,504 個</text>
<text x="141.0" y="249.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#898781">token 以上，搬權重才比搬 token 便宜（已驗證：算術）</text>
<text x="141.0" y="264.0" text-anchor="middle" font-size="7.1" font-weight="700" fill="#1baf7a">decode 每步每專家遠少於此 → 搬 token</text>
<text x="141.0" y="277.0" text-anchor="start" font-size="6" font-weight="400" fill="#898781"></text>
