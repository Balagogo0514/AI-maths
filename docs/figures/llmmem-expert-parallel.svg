<text x="415.0" y="241.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#0b0b0b">32 層共約 0.92 MB；N 增加趨近上限約 1.05 MB</text>
<text x="415.0" y="254.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">（已驗證：算術，假設路由均勻、k=2、d=4096）</text>
