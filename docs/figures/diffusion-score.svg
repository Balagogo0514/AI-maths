<text x="467" y="140" text-anchor="middle" font-size="8" fill="#1baf7a">處處有定義的 score 場</text>
<text x="467" y="150" text-anchor="middle" font-size="7.5" fill="#898781">從任意噪聲都能找到方向</text>
<rect x="285" y="158" width="244" height="38" rx="4" fill="#1baf7a" opacity="0.09" stroke="#1baf7a" stroke-width="1"/>
<text x="407" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#1baf7a">核心等價（Denoising Score Matching）</text>
<text x="407" y="182" text-anchor="middle" font-size="8.5" fill="#0b0b0b">∇_xₜ log p_t(xₜ) = −ε / √(1−ᾱₜ)</text>
<text x="407" y="193" text-anchor="middle" font-size="8" fill="#898781">預測噪聲 ε̂  ≡  估計 score function（Tweedie 公式）</text>
<rect x="285" y="202" width="244" height="28" rx="3" fill="#7c56c8" opacity="0.08" stroke="#7c56c8" stroke-width="0.8"/>
<text x="407" y="212" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7c56c8">為什麼 MSE(ε̂,ε) = 學 score？</text>
<text x="407" y="224" text-anchor="middle" font-size="8" fill="#898781">xₜ = √ᾱₜ x₀ + √(1−ᾱₜ)ε  →  ε = (xₜ−√ᾱₜ x₀)/√(1−ᾱₜ)</text>
<rect x="285" y="237" width="244" height="38" rx="3" fill="#eda100" opacity="0.09" stroke="#eda100" stroke-width="0.8"/>
<text x="407" y="249" text-anchor="middle" font-size="9" font-weight="700" fill="#eda100">為什麼不直接學 p(x)？</text>
<text x="291" y="261" font-size="8.5" fill="#898781">p(x) = e^{−E(x)}/Z，Z = ∫e^{−E(x)}dx  （高維中不可計算）</text>
<text x="291" y="273" font-size="8.5" fill="#eda100">學 ∇_x log p = −∇E(x)，Z 被微分消掉！不需要計算 Z</text>
<rect x="549" y="10" width="261" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="679" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">SDE 完整理論（Anderson 1982）</text>
<rect x="557" y="34" width="245" height="34" rx="4" fill="#d94040" opacity="0.08" stroke="#d94040" stroke-width="0.8"/>
<text x="679" y="46" text-anchor="middle" font-size="9" font-weight="700" fill="#d94040">前向 SDE（固定數學，無需學習）</text>
<text x="679" y="61" text-anchor="middle" font-size="9" fill="#898781">dx = f(x,t) dt + g(t) dW   ← Itô 擴散</text>
<text x="557" y="95" font-size="8.5" font-weight="700" fill="#d94040">前向過程：任何分布 → 高斯</text>
<ellipse cx="575" cy="115" rx="14" ry="22" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="1.2"/>
<text x="575" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">p_data</text>
<text x="575" y="124" text-anchor="middle" font-size="7" fill="#898781">複雜</text>
<line x1="590.0" y1="115.0" x2="625.0" y2="115.0" stroke="#d94040" stroke-width="1.5"/>
<polygon points="625.0,115.0 618.0,119.0 618.0,111.0" fill="#d94040"/>
<text x="607.5" y="107.0" text-anchor="middle" font-size="8" fill="#d94040" font-style="italic">加噪</text>
<ellipse cx="640" cy="115" rx="12" ry="16" fill="#eb6834" opacity="0.15" stroke="#eb6834" stroke-width="1.2"/>
<text x="640" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">p_{T/2}</text>
<text x="640" y="124" text-anchor="middle" font-size="7" fill="#898781">半噪</text>
<line x1="653.0" y1="115.0" x2="688.0" y2="115.0" stroke="#d94040" stroke-width="1.5"/>
<polygon points="688.0,115.0 681.0,119.0 681.0,111.0" fill="#d94040"/>
<ellipse cx="703" cy="115" rx="11" ry="11" fill="#898781" opacity="0.15" stroke="#898781" stroke-width="1.2"/>
<text x="703" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#898781">p_T</text>
<text x="703" y="124" text-anchor="middle" font-size="7" fill="#898781">≈N(0,I)</text>
<line x1="715.0" y1="115.0" x2="787.0" y2="115.0" stroke="#d94040" stroke-width="1.5"/>
<polygon points="787.0,115.0 780.0,119.0 780.0,111.0" fill="#d94040"/>
<text x="751.0" y="107.0" text-anchor="middle" font-size="8" fill="#d94040" font-style="italic">→ 標準高斯</text>
<text x="557" y="150" font-size="8.5" font-weight="700" fill="#1baf7a">逆向過程：高斯 → 任何分布（僅需 score）</text>
<ellipse cx="787" cy="170" rx="11" ry="11" fill="#898781" opacity="0.15" stroke="#898781" stroke-width="1.2"/>
<text x="787" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#898781">xₜ~𝒩</text>
<text x="787" y="179" text-anchor="middle" font-size="7" fill="#898781">採樣起點</text>
<line x1="776.0" y1="170.0" x2="737.0" y2="170.0" stroke="#1baf7a" stroke-width="1.5"/>
<polygon points="737.0,170.0 744.0,166.0 744.0,174.0" fill="#1baf7a"/>
<ellipse cx="725" cy="170" rx="12" ry="16" fill="#eb6834" opacity="0.15" stroke="#eb6834" stroke-width="1.2"/>
<text x="725" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">p_{T/2}</text>
<text x="725" y="179" text-anchor="middle" font-size="7" fill="#898781">去噪中</text>
<line x1="712.0" y1="170.0" x2="668.0" y2="170.0" stroke="#1baf7a" stroke-width="1.5"/>
<polygon points="668.0,170.0 675.0,166.0 675.0,174.0" fill="#1baf7a"/>
<ellipse cx="655" cy="170" rx="14" ry="22" fill="#2a78d6" opacity="0.15" stroke="#2a78d6" stroke-width="1.2"/>
<text x="655" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#2a78d6">p_data</text>
<text x="655" y="179" text-anchor="middle" font-size="7" fill="#898781">生成圖像</text>
<rect x="557" y="195" width="245" height="34" rx="4" fill="#1baf7a" opacity="0.09" stroke="#1baf7a" stroke-width="1"/>
<text x="679" y="207" text-anchor="middle" font-size="9" font-weight="700" fill="#1baf7a">逆向 SDE（Anderson 1982 定理）</text>
<text x="679" y="222" text-anchor="middle" font-size="8.5" fill="#0b0b0b">dx = [f − g² ∇_x log pₜ(x)] dt + g dW̄</text>
<rect x="557" y="237" width="245" height="40" rx="3" fill="#7c56c8" opacity="0.08" stroke="#7c56c8" stroke-width="0.8"/>
<text x="679" y="249" text-anchor="middle" font-size="9" font-weight="700" fill="#7c56c8">DDPM / DDIM 的統一視角</text>
<text x="563" y="261" font-size="8.5" fill="#898781">DDPM = 離散化逆向 SDE（有隨機項 σ_t z）</text>
<text x="563" y="273" font-size="8.5" fill="#2a78d6">DDIM = 離散化逆向 ODE（無隨機項，確定採樣）</text>
</svg>