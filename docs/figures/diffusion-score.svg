<text x="137" y="190" text-anchor="middle" font-size="8.5" fill="#898781">訓練初期 p_gen ∩ p_data ≈ ∅</text>
<text x="137" y="201" text-anchor="middle" font-size="8.5" fill="#d94040">⟹ JS = log 2（常數）⟹ 梯度 = 0</text>
<text x="137" y="212" text-anchor="middle" font-size="8" fill="#898781">Generator 學不到任何東西</text>
