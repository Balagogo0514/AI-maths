<text x="684.0" y="250.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">d ≈ 47 對應的典型 n 只有約 90，離散效應主導</text>
<text x="684.0" y="263.0" text-anchor="middle" font-size="8" font-weight="700" fill="#d94040">更新定理 F_d(1) → 1/a：深度不足，無結論</text>
