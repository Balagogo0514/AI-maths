<text x="49.0" y="56.0" text-anchor="start" font-size="7.2" font-weight="700" fill="#0b0b0b">藍：M(s)　橘：2^(−s) + 3^s/6（反向樹）</text>
<rect x="18" y="176" width="246" height="108" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="190.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">M(0) = M(1) = 1，M′(0) = ½ ln(3/4) &lt; 0（負漂移）</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">E[T(x)/x] = ½·½ + ½·3/2 = 1：平均值守恆</text>
<text x="141.0" y="217.0" text-anchor="middle" font-size="8" font-weight="700" fill="#1baf7a">Cramér 指數 = M(s) = 1 的非零根 s* = 1</text>
<text x="141.0" y="231.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">反向樹：2^(−1) + 3·(1/6) = 1（假設節點在模 6 均勻）</text>
<text x="141.0" y="245.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">另一個根 s ≈ 0.477（空心橘點）：我不知道它的意義</text>
<text x="141.0" y="259.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">s = 1 與 ζ 的極點（§3.13）、對數密度同一個位置</text>
<text x="141.0" y="272.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">代數恆等式；均勻性是假設</text>
