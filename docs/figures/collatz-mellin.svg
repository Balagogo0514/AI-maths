<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Mellin–Perron 與更新定理的嘗試</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">D(s) = Σ steps(n) n^(−s)，Mellin–Perron 公式</text>
<rect x="566" y="48" width="236" height="52" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="684.0" y="62.0" text-anchor="middle" font-size="7.8" font-weight="700" fill="#0b0b0b">D(s) ≈ a/(s−1)² + b/(s−1)（啟發式，未驗證）</text>
<text x="684.0" y="75.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">Σ_(n≤x) steps(n) = Res D(s)·x^s/s = x[ a(ln x − 1) + b ]</text>
<text x="684.0" y="88.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">與 §3.16 的 S(N) ≈ a(N ln N − N) + bN 同形（推導）</text>
