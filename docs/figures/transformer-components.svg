<text x="566" y="109" text-anchor="end" font-size="8" fill="#898781">FFN W₁</text>
<rect x="568" y="118" width="41.0" height="16" rx="2" fill="#2a78d6" opacity="0.7"/>
<text x="612.0" y="129" font-size="8.5" fill="#2a78d6" font-weight="600">58.7M</text>
<text x="566" y="129" text-anchor="end" font-size="8" fill="#898781">FFN W₂</text>
<rect x="568" y="138" width="41.0" height="16" rx="2" fill="#2a78d6" opacity="0.7"/>
<text x="612.0" y="149" font-size="8.5" fill="#2a78d6" font-weight="600">58.7M</text>
<text x="566" y="149" text-anchor="end" font-size="8" fill="#898781">FFN W₃</text>
<rect x="568" y="164" width="234" height="30" rx="4" fill="#2a78d6" opacity="0.1" stroke="#2a78d6" stroke-width="0.8"/>
<text x="685" y="176" text-anchor="middle" font-size="9" fill="#2a78d6" font-weight="700">Attention : FFN ≈ 1 : 2.1</text>
<text x="685" y="188" text-anchor="middle" font-size="8.5" fill="#898781">FFN 通常占每層參數的 60–65%</text>
<rect x="568" y="202" width="234" height="82" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.8"/>
<text x="685" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#eb6834">MoE 稀疏化 FFN</text>
<text x="572" y="228" font-size="8.5" fill="#eb6834">N 個 Expert FFN，每次只激活 Top-K 個</text>
<text x="572" y="240" font-size="8.5" fill="#898781">• Router = softmax(xWg) → 選 K/N Expert</text>
<text x="572" y="252" font-size="8.5" fill="#eb6834">• DeepSeek-V3：671B 參數 / 37B 激活</text>
<text x="572" y="264" font-size="8.5" fill="#898781">• 推理成本 ≈ 37B 密集模型</text>
<text x="572" y="276" font-size="8.5" fill="#898781">• 輔助損失防止 Expert 崩塌（負載均衡）</text>
