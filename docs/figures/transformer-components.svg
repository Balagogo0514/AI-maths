<text x="137" y="110" text-anchor="middle" font-size="7.5" fill="#eb6834" transform="rotate(-90,137,110)">殘差</text>
<rect x="14" y="215" width="252" height="70" rx="4" fill="#7c56c8" opacity="0.07" stroke="#7c56c8" stroke-width="0.8"/>
<text x="140" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#7c56c8">RMSNorm vs LayerNorm</text>
<text x="20" y="243" font-size="8.5" fill="#898781">LN(x) = (x−μ)/σ · γ + β   （計算均值+方差）</text>
<text x="20" y="257" font-size="8.5" fill="#7c56c8">RMS(x) = √(1/d·Σxᵢ²),  RMSNorm = x/RMS·γ</text>
<text x="20" y="271" font-size="8.5" fill="#1baf7a">省略均值計算 → 快 ~15%，LLaMA/Qwen 採用</text>
<rect x="285" y="10" width="260" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">FFN 變體比較</text>
<rect x="292" y="36" width="246" height="46" rx="4" fill="#898781" opacity="0.09" stroke="#898781" stroke-width="1"/>
<text x="298" y="49" font-size="9.5" font-weight="700" fill="#898781">Standard FFN</text>
<text x="298" y="62" font-size="8.5" fill="#0b0b0b" font-family="monospace">ReLU(xW₁+b₁)·W₂+b₂</text>
<text x="298" y="74" font-size="8" fill="#898781">2 矩陣，無閘控  |  原始 Transformer</text>
<rect x="292" y="88" width="246" height="46" rx="4" fill="#eda100" opacity="0.09" stroke="#eda100" stroke-width="1"/>
<text x="298" y="101" font-size="9.5" font-weight="700" fill="#eda100">GELU FFN</text>
<text x="298" y="114" font-size="8.5" fill="#0b0b0b" font-family="monospace">GELU(xW₁)·W₂</text>
<text x="298" y="126" font-size="8" fill="#898781">平滑激活函數  |  BERT, GPT-2</text>
<rect x="292" y="140" width="246" height="46" rx="4" fill="#2a78d6" opacity="0.09" stroke="#2a78d6" stroke-width="1"/>
<text x="298" y="153" font-size="9.5" font-weight="700" fill="#2a78d6">SwiGLU</text>
<text x="298" y="166" font-size="8.5" fill="#0b0b0b" font-family="monospace">Swish(xW₁)⊙xW₂·W₃</text>
<text x="298" y="178" font-size="8" fill="#898781">3 矩陣，閘控機制  |  LLaMA, PaLM, Qwen</text>
<rect x="292" y="192" width="246" height="46" rx="4" fill="#7c56c8" opacity="0.09" stroke="#7c56c8" stroke-width="1"/>
<text x="298" y="205" font-size="9.5" font-weight="700" fill="#7c56c8">GeGLU</text>
<text x="298" y="218" font-size="8.5" fill="#0b0b0b" font-family="monospace">GELU(xW₁)⊙xW₂·W₃</text>
<text x="298" y="230" font-size="8" fill="#898781">3 矩陣，GELU 閘  |  T5 v1.1</text>
<rect x="292" y="248" width="246" height="62" rx="4" fill="#2a78d6" opacity="0.07" stroke="#2a78d6" stroke-width="0.8"/>
<text x="415" y="261" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a78d6">SwiGLU 閘控機制</text>
<text x="298" y="275" font-size="8.5" fill="#0b0b0b">Swish(z) = z · σ(z)  （平滑 ReLU）</text>
<text x="298" y="286" font-size="8.5" fill="#2a78d6">xW₁ → 激活分支（Swish）</text>
<text x="298" y="297" font-size="8.5" fill="#2a78d6">xW₂ → 閘控分支（線性）</text>
<text x="298" y="308" font-size="8.5" fill="#2a78d6">兩分支逐元素相乘 ⊙ → 選擇性通過</text>
<rect x="560" y="10" width="250" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="685" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">參數分布（每層）</text>
