<text x="337" y="231" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#eb6834">1</text>
<text x="355" y="231" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#898781">,</text>
<text x="373" y="231" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2a78d6">1</text>
<text x="355" y="286" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eb6834" font-weight="bold">◀ Nash 均衡（個體理性）</text>
<text x="448" y="100" font-family="sans-serif" font-size="10" fill="#eb6834">A 的收益</text>
<text x="448" y="118" font-family="sans-serif" font-size="10" fill="#2a78d6">B 的收益</text>
<text x="448" y="154" font-family="sans-serif" font-size="10" fill="#1baf7a">背叛是嚴格優勢策略</text>
<text x="448" y="172" font-family="sans-serif" font-size="10" fill="#898781">無論 B 怎麼選，</text>
<text x="448" y="190" font-family="sans-serif" font-size="10" fill="#898781">A 背叛都更好</text>
<text x="448" y="226" font-family="sans-serif" font-size="10" fill="#eb6834">Nash 均衡 (D,D)=(1,1)</text>
<text x="448" y="244" font-family="sans-serif" font-size="10" fill="#1baf7a">Pareto 最優 (C,C)=(3,3)</text>
<text x="448" y="262" font-family="sans-serif" font-size="10" fill="#898781">→ 個體理性≠集體最優</text>
</svg>