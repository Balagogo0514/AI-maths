<text x="128" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#eb6834" transform="rotate(-90,128,180)">參與者 A</text>
<text x="225" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1baf7a">合作 (C)</text>
<text x="146" y="140" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1baf7a">合作 (C)</text>
<text x="355" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#eb6834">背叛 (D)</text>
<text x="146" y="230" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#eb6834">背叛 (D)</text>
<rect x="160" y="90" width="130" height="90" fill="#e8f7f1" stroke="#1baf7a" stroke-width="2.5"/>
