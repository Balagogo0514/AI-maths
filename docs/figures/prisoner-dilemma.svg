<text x="225" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#898781">,</text>
<text x="243" y="141" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2a78d6">3</text>
<text x="225" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1baf7a" font-weight="bold">Pareto 最優（集體最優）▲</text>
<rect x="290" y="90" width="130" height="90" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="337" y="141" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#eb6834">0</text>
<text x="355" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#898781">,</text>
<text x="373" y="141" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2a78d6">5</text>
<rect x="160" y="180" width="130" height="90" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="207" y="231" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="bold" fill="#eb6834">5</text>
