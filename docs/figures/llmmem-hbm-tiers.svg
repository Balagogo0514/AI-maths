<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="system-ui,sans-serif">
<rect width="820" height="300" fill="#fcfcfb" rx="10"/>
<rect x="10" y="10" width="262" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">容量：HBM 放得下多少 token</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.3" font-weight="400" fill="#898781">假設 70B 等級 GQA、8 × 80 GB（算術，不是實測）</text>
<rect x="24.0" y="52" width="49.4" height="16" fill="#eb6834" opacity="0.85"/>
<rect x="73.4" y="52" width="176.6" height="16" fill="#1baf7a" opacity="0.85"/>
<text x="48.7" y="63.0" text-anchor="middle" font-size="7" font-weight="700" fill="white">權重 140</text>
<text x="161.7" y="63.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="white">可用於 KV：500 GB</text>
<text x="24.0" y="82.0" text-anchor="start" font-size="6.9" font-weight="400" fill="#898781">總 HBM 640 GB（暫存緩衝與碎片未計）</text>
<text x="18.0" y="102.0" text-anchor="start" font-size="7.4" font-weight="700" fill="#0b0b0b">能放的 KV token 數</text>
<rect x="24.0" y="108" width="80.0" height="12" fill="#2a78d6" opacity="0.85"/>
<text x="109.0" y="118.0" text-anchor="start" font-size="7.3" font-weight="700" fill="#2a78d6">bf16：1.53 M token</text>
<rect x="24.0" y="125" width="160.0" height="12" fill="#1baf7a" opacity="0.85"/>
<text x="189.0" y="135.0" text-anchor="start" font-size="7.3" font-weight="700" fill="#1baf7a">FP8：3.05 M token</text>
<rect x="18" y="148" width="246" height="38" rx="4" fill="#2a78d6" opacity="0.07" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="162.0" text-anchor="middle" font-size="7.4" font-weight="700" fill="#0b0b0b">每個請求 8,192 token → 約 186 個並行請求</text>
<text x="141.0" y="175.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">容量 = 並行請求數 × 平均上下文的上限</text>
<rect x="18" y="196" width="246" height="88" rx="4" fill="#eb6834" opacity="0.06" stroke="#eb6834" stroke-width="0.9"/>
<text x="141.0" y="211.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0b0b0b">省容量的手段</text>
<text x="141.0" y="225.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#0b0b0b">GQA／MQA、KV 量化、滑動視窗（讓每個 token 變小）</text>
<text x="141.0" y="238.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#0b0b0b">Paged Attention（減少碎片浪費）、前綴共享</text>
<text x="141.0" y="251.0" text-anchor="middle" font-size="7.0" font-weight="400" fill="#0b0b0b">多 GPU 切分（總容量變大）</text>
<text x="141.0" y="266.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#d94040">GPU 規格是依印象設的假設</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">頻寬：每個 decode 步讀什麼</text>
<text x="415.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">8 張 GPU 合計 26.8 TB/s；單位 ms（算術）</text>
<text x="334.0" y="66.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">1 × 8K</text>
<rect x="340.0" y="56" width="46.2" height="14" fill="#eb6834" opacity="0.8"/>
<rect x="386.2" y="56" width="1.2" height="14" fill="#2a78d6" opacity="0.85"/>
<text x="391.1" y="66.5" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">0.1</text>
<text x="334.0" y="90.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">32 × 8K</text>
<rect x="340.0" y="80" width="46.2" height="14" fill="#eb6834" opacity="0.8"/>
<rect x="386.2" y="80" width="28.3" height="14" fill="#2a78d6" opacity="0.85"/>
<text x="418.5" y="90.5" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">3.2</text>
<text x="334.0" y="114.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">64 × 8K</text>
<rect x="340.0" y="104" width="46.2" height="14" fill="#eb6834" opacity="0.8"/>
<rect x="386.2" y="104" width="56.7" height="14" fill="#2a78d6" opacity="0.85"/>
<text x="446.8" y="114.5" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">6.4</text>
<text x="334.0" y="138.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">32 × 32K</text>
<rect x="340.0" y="128" width="46.2" height="14" fill="#eb6834" opacity="0.8"/>
<rect x="386.2" y="128" width="113.3" height="14" fill="#2a78d6" opacity="0.85"/>
<text x="503.5" y="138.5" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">12.8</text>
<text x="334.0" y="162.0" text-anchor="end" font-size="7.1" font-weight="700" fill="#0b0b0b">1 × 1M</text>
<rect x="340.0" y="152" width="46.2" height="14" fill="#eb6834" opacity="0.8"/>
<rect x="386.2" y="152" width="108.1" height="14" fill="#2a78d6" opacity="0.85"/>
<text x="498.3" y="162.5" text-anchor="start" font-size="7.2" font-weight="700" fill="#2a78d6">12.2</text>
<text x="300.0" y="178.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#eb6834">■ 權重 5.2 ms（批次內共攤）</text>
<text x="420.0" y="178.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#2a78d6">■ KV（各請求各讀各的）</text>
<text x="300.0" y="190.0" text-anchor="start" font-size="6.5" font-weight="400" fill="#898781">縱軸：請求數 × 每請求 token 數</text>
<rect x="290" y="200" width="250" height="84" rx="4" fill="#7c56c8" opacity="0.06" stroke="#7c56c8" stroke-width="0.9"/>
<text x="415.0" y="214.0" text-anchor="middle" font-size="7.3" font-weight="700" fill="#0b0b0b">批次內總 token 超過約 427K，讀 KV 就比讀權重慢</text>
<text x="415.0" y="227.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">加大批次能攤薄權重的讀取，攤不薄 KV 的讀取</text>
<text x="415.0" y="240.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">所以長上下文服務傾向受 KV 頻寬限制</text>
<text x="415.0" y="254.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">Paged Attention、Flash Attention 不減少要讀的 KV bytes</text>
<text x="415.0" y="267.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#898781">GQA、量化、視窗、稀疏才會（§12.6、§15.3）</text>
<rect x="558" y="10" width="252" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="684.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">離開 HBM：讀完一百萬 token 的 KV</text>
<text x="684.0" y="42.0" text-anchor="middle" font-size="7.2" font-weight="400" fill="#898781">KV = 327.7 GB；每個 token 都完整讀一遍（對數刻度）</text>
<text x="622.0" y="64.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">8 張 HBM</text>
<rect x="628.0" y="54" width="14.9" height="14" fill="#1baf7a" opacity="0.85"/>
<text x="646.9" y="64.5" text-anchor="start" font-size="7.3" font-weight="700" fill="#1baf7a">12 ms</text>
<text x="622.0" y="88.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">1 張 HBM</text>
<rect x="628.0" y="78" width="49.6" height="14" fill="#1baf7a" opacity="0.85"/>
<text x="681.6" y="88.5" text-anchor="start" font-size="7.3" font-weight="700" fill="#1baf7a">98 ms</text>
<text x="622.0" y="112.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">CPU DRAM</text>
<rect x="628.0" y="102" width="85.1" height="14" fill="#eda100" opacity="0.85"/>
<text x="717.1" y="112.5" text-anchor="start" font-size="7.3" font-weight="700" fill="#eda100">0.82 秒</text>
<text x="622.0" y="136.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">PCIe 5 x16</text>
<rect x="628.0" y="126" width="115.7" height="14" fill="#eb6834" opacity="0.85"/>
<text x="747.7" y="136.5" text-anchor="start" font-size="7.3" font-weight="700" fill="#eb6834">5.1 秒</text>
<text x="622.0" y="160.0" text-anchor="end" font-size="7.2" font-weight="700" fill="#0b0b0b">NVMe SSD</text>
<rect x="628.0" y="150" width="141.1" height="14" fill="#d94040" opacity="0.85"/>
<text x="773.1" y="160.5" text-anchor="start" font-size="7.3" font-weight="700" fill="#d94040">23.4 秒</text>
<text x="684.0" y="178.0" text-anchor="middle" font-size="6.3" font-weight="400" fill="#898781">頻寬為依印象設的量級：DRAM 約 400 GB/s、PCIe 約 64 GB/s、SSD 約 14 GB/s</text>
<rect x="566" y="188" width="236" height="96" rx="4" fill="#eb6834" opacity="0.07" stroke="#eb6834" stroke-width="0.9"/>
<text x="684.0" y="202.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0b0b0b">完整、精確的 attention：幾乎需要 KV 常駐 HBM</text>
<text x="684.0" y="215.0" text-anchor="middle" font-size="7.1" font-weight="400" fill="#0b0b0b">放得下 ≠ 跑得快：放 DRAM 約 0.8 秒／token</text>
<text x="684.0" y="229.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#1baf7a">出路：少讀，例如只讀最相關的 4,096 個 token</text>
<text x="684.0" y="242.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#1baf7a">讀 1.34 GB：DRAM 約 3.4 ms、PCIe 約 21 ms</text>
<text x="684.0" y="256.0" text-anchor="middle" font-size="7.0" font-weight="700" fill="#d94040">代價：不再與完整 attention 精確相等（近似）</text>
<text x="684.0" y="270.0" text-anchor="middle" font-size="6.8" font-weight="400" fill="#898781">預取重疊、通訊、實際利用率未計入</text>
</svg>