<svg xmlns="http://www.w3.org/2000/svg" width="580" height="410" viewBox="0 0 580 410">
<rect width="580" height="410" fill="#fcfcfb" rx="8"/>
<text x="290" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b">Shannon 資訊量關係圖</text>
<defs>
<clipPath id="cl"><circle cx="210" cy="215" r="150"/></clipPath>
<clipPath id="cr"><circle cx="370" cy="215" r="150"/></clipPath>
</defs>
<circle cx="210" cy="215" r="150" fill="#2a78d6" opacity="0.18" stroke="none"/>
<circle cx="370" cy="215" r="150" fill="#eb6834" opacity="0.18" stroke="none"/>
<circle cx="370" cy="215" r="150" fill="#1baf7a" opacity="0.35" clip-path="url(#cl)" stroke="none"/>
<circle cx="210" cy="215" r="150" fill="none" stroke="#2a78d6" stroke-width="2"/>
<circle cx="370" cy="215" r="150" fill="none" stroke="#eb6834" stroke-width="2"/>
<line x1="60" y1="393" x2="520" y2="393" stroke="#898781" stroke-width="1.2"/>
<line x1="60" y1="388" x2="60" y2="398" stroke="#898781" stroke-width="1.2"/>
<line x1="520" y1="388" x2="520" y2="398" stroke="#898781" stroke-width="1.2"/>
<text x="290" y="409" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#898781" font-style="italic">H(X,Y)</text>
<text x="127" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#2a78d6">H(X|Y)</text>
<text x="127" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">（已知Y後</text>
<text x="127" y="239" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">X的不確定性）</text>
<text x="290" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#1baf7a">I(X;Y)</text>
<text x="290" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">（互資訊）</text>
<text x="453" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#eb6834">H(Y|X)</text>
<text x="453" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">（已知X後</text>
<text x="453" y="239" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#898781">Y的不確定性）</text>
<text x="210" y="53" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#2a78d6">H(X)</text>
<text x="370" y="53" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#eb6834">H(Y)</text>
<text x="565" y="55" text-anchor="end" font-family="monospace" font-size="11" fill="#0b0b0b">H(X,Y) = H(X) + H(Y|X)</text>
<text x="565" y="77" text-anchor="end" font-family="monospace" font-size="11" fill="#0b0b0b">H(X,Y) = H(Y) + H(X|Y)</text>
<text x="565" y="99" text-anchor="end" font-family="monospace" font-size="11" fill="#1baf7a">I(X;Y) = H(X) − H(X|Y)</text>
<text x="565" y="121" text-anchor="end" font-family="monospace" font-size="11" fill="#1baf7a">I(X;Y) = H(Y) − H(Y|X)</text>
<text x="565" y="143" text-anchor="end" font-family="monospace" font-size="11" fill="#898781">I(X;Y) ≥ 0（等號：獨立）</text>
</svg>