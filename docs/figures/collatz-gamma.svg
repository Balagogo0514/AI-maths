<text x="141.0" y="230.0" text-anchor="middle" font-size="8" font-weight="700" fill="#1baf7a">元素互異 ⇒ 2^k/3^s 至多這麼大，只長 s^(1/6)</text>
<text x="141.0" y="243.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">粗上界 (4/3)^s：s = 10 就是 17.8</text>
