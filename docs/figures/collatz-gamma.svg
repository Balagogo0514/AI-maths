<text x="141.0" y="190.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">漸近式：√π/Γ(⅔)·s^(1/6)，√π/Γ(⅔) = 1.3089</text>
<text x="141.0" y="203.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">s = 10³：4.1393 vs 4.1392</text>
