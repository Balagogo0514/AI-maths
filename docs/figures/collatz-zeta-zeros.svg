<text x="201.0" y="102.0" text-anchor="start" font-size="7.5" font-weight="700" fill="#d94040">z=1：5 階</text>
<circle cx="167.0" cy="106.0" r="3.2" fill="#2a78d6"/>
<text x="163.0" y="118.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">ℤ₂：z=½</text>
<text x="141.0" y="180.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">● 極點（單位根）　○ 5 階極點　● ℤ₂ 的極點 z=½</text>
<rect x="18" y="192" width="246" height="92" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="141.0" y="206.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">動力 zeta 是有理函數：沒有零點，只有單位根的極點</text>
<text x="141.0" y="219.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1baf7a">級數 exp(Σ N_k z^k/k) 與乘積到 z¹⁸ 逐項相等（精確分數）</text>
<text x="141.0" y="233.0" text-anchor="middle" font-size="8" font-weight="400" fill="#898781">ℤ₂：ζ_T = 1/(1−2z)，也沒有零點</text>
<text x="141.0" y="247.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">不存在「零點是否排在一條線上」的問題</text>
<text x="141.0" y="261.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">（部分雙曲系統的 Selberg zeta 有類 RH 結構，記憶）</text>
<text x="141.0" y="274.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">對照：Riemann ζ 的零點位置才是難題</text>
<rect x="282" y="10" width="266" height="280" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
<text x="415.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Dirichlet 級數的收斂域與零點錯開</text>
