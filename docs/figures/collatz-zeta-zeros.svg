<text x="141.0" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">動力 zeta：零點與極點都是顯式的</text>
<text x="141.0" y="42.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ζ_T(z) = (1−z)⁻²(1−z²)⁻¹(1−z³)⁻¹(1−z¹¹)⁻¹（k ≤ 18）</text>
