<text x="391.3" y="54.0" text-anchor="middle" font-size="7" font-weight="700" fill="#eb6834">非平凡零點（γ 為記憶值）</text>
<text x="482.0" y="108.0" text-anchor="middle" font-size="9" font-weight="700" fill="#2a78d6">Re s &gt; 1</text>
<text x="482.0" y="120.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#2a78d6">Σ F_d(s) 絕對收斂</text>
<text x="482.0" y="131.0" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2a78d6">ζ 沒有零點</text>
<rect x="290" y="192" width="250" height="92" rx="4" fill="#2a78d6" opacity="0.06" stroke="#2a78d6" stroke-width="0.9"/>
<text x="415.0" y="206.0" text-anchor="middle" font-size="8" font-weight="700" fill="#0b0b0b">猜想 ⇔ E(s) = ζ(s) − Σ_d F_d(s) ≡ 0（§3.14）</text>
<text x="415.0" y="219.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">級數只在 Re s &gt; 1 收斂（被 ζ(σ) 控制）</text>
<text x="415.0" y="233.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">ζ 在 Re s ≥ 1 沒有零點（標準結果）</text>
<text x="415.0" y="247.0" text-anchor="middle" font-size="8" font-weight="700" fill="#eb6834">⇒ 這個等式只在「沒有零點」的區域有意義</text>
<text x="415.0" y="261.0" text-anchor="middle" font-size="7.5" font-weight="400" fill="#898781">非平凡零點在 0 &lt; Re s &lt; 1，不在收斂域內</text>
<text x="415.0" y="274.0" text-anchor="middle" font-size="7" font-weight="400" fill="#898781">示意圖：縱軸為 Im s，未依比例繪製</text>
