<text x="190.0" y="235.5" text-anchor="start" font-size="6.4" font-weight="400" fill="#0b0b0b">11.27B</text>
<text x="222.0" y="235.5" text-anchor="start" font-size="5.6" font-weight="400" fill="#898781">C(16,4)=1,820</text>
<rect x="18" y="242" width="246" height="15" rx="4" fill="#1baf7a" opacity="0.07" stroke="#1baf7a" stroke-width="0.9"/>
<text x="22.0" y="252.5" text-anchor="start" font-size="6.3" font-weight="700" fill="#0b0b0b">C：1 共享＋7 路由、top-1</text>
<text x="150.0" y="252.5" text-anchor="start" font-size="6.4" font-weight="400" fill="#0b0b0b">45.10B</text>
<text x="190.0" y="252.5" text-anchor="start" font-size="6.4" font-weight="400" fill="#0b0b0b">11.27B</text>
