<text x="415.0" y="222.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#0b0b0b">省下 5376 = (E−1)·r_c·2d（已驗證：公式與差值一致）</text>
<text x="415.0" y="235.0" text-anchor="middle" font-size="6.9" font-weight="400" fill="#0b0b0b">共享專家避免每個專家重複存一份共同部分</text>
<text x="415.0" y="249.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#d94040">真實模型的通用／專門知識沒有這麼乾淨的線性分解</text>
<text x="415.0" y="262.0" text-anchor="middle" font-size="6.8" font-weight="700" fill="#d94040">「共享專家提升品質」是記憶中的論點，未驗證</text>
